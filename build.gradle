plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.7'
    id 'maven-publish'
}

group 'net.cengiz1.uxmskyblock'
// The published version. -PprojectVersion is how the release workflow passes the tag; the literal
// below is what a local build and a manual publish use.
version = project.findProperty('projectVersion') ?: '0.4.0'

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://maven.enginehub.org/repo/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'

    compileOnly platform('com.intellectualsites.bom:bom-newest:1.56')
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core'
    compileOnly('com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit') { transitive = false }

    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'

    compileOnly 'me.clip:placeholderapi:2.11.6'

    compileOnly 'com.google.code.gson:gson:2.10.1'

    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'

    implementation 'redis.clients:jedis:5.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

shadowJar {
    archiveFileName = 'uxmSkyblock-' + version + '.jar'
}

build {
    dependsOn shadowJar
}

jar {
    archiveBaseName = 'uxmSkyblock-api'
}

publishing {
    publications {
        maven(MavenPublication) {
            // com.github.UXPLIMA:uxmSkyblock before this, which is JitPack's layout and not a coordinate
            // anything could resolve: JitPack answers 404 for that group at every version this repository
            // has ever carried, and there is no 0.4.0 tag for it to have built. uxmChunkLock and uxmMinions
            // both pin 0.4.0, so both were unresolvable, and the API jar existed only on whichever machine
            // last ran publishToMavenLocal. These are the coordinates the rest of the organisation uses:
            // com.uxplima.<domain>, with a lower-case artifact id.
            groupId = 'com.uxplima.skyblock'
            artifactId = 'uxmskyblock-api'
            version = project.version
            // The plain api jar and its sources, not from(components.java): the shaded server jar is a
            // plugin rather than a library, and the implementation dependencies bundled into it (SQLite,
            // MySQL, Jedis) are this plugin's business and not a consumer's.
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
        }
    }

    repositories {
        maven {
            name = 'uxplima-nexus'
            // The suffix picks the target: maven-snapshots takes the timestamped layout, maven-releases
            // refuses to overwrite a coordinate that already exists. Deciding it anywhere else means a
            // release run that fails at the end rather than the start.
            def snapshot = project.version.toString().endsWith('SNAPSHOT')
            url = snapshot
                ? 'https://repo.uxplima.com/repository/maven-snapshots/'
                : 'https://repo.uxplima.com/repository/maven-releases/'
            // CI exports the environment variables; a developer publishing by hand keeps the properties in
            // ~/.gradle/gradle.properties. The property wins, so a machine whose environment already holds
            // another account can override it.
            credentials {
                username = findProperty('uxplimaNexusUser') ?: System.getenv('UXPLIMA_NEXUS_USER')
                password = findProperty('uxplimaNexusPass') ?: System.getenv('UXPLIMA_NEXUS_PASS')
            }
        }
    }
}
