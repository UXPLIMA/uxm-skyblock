plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.7'
    id 'maven-publish'
}

group 'net.cengiz1.uxmskyblock'
version = project.findProperty('projectVersion') ?: '0.4.0'

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://maven.enginehub.org/repo/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'

    compileOnly platform('com.intellectualsites.bom:bom-newest:1.56')
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core'
    compileOnly('com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit') { transitive = false }

    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.google.code.gson:gson:2.10.1'

    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'redis.clients:jedis:5.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveFileName = "uxmSkyblock-${version}.jar"
    relocate 'redis.clients.jedis', 'net.cengiz1.uxmskyblock.libs.jedis'
    relocate 'org.apache.commons.pool2', 'net.cengiz1.uxmskyblock.libs.pool2'
}

build {
    dependsOn shadowJar
}

jar {
    archiveBaseName = 'uxmSkyblock-api'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.uxplima.skyblock'
            artifactId = 'uxmskyblock-api'
            version = project.version
            artifact tasks.named('jar')
            artifact tasks.named('sourcesJar')
        }
    }

    repositories {
        maven {
            name = 'uxplima-nexus'
            def snapshot = project.version.toString().endsWith('SNAPSHOT')
            url = snapshot
                ? 'https://repo.uxplima.com/repository/maven-snapshots/'
                : 'https://repo.uxplima.com/repository/maven-releases/'
            credentials {
                username = findProperty('uxplimaNexusUser') ?: System.getenv('UXPLIMA_NEXUS_USER')
                password = findProperty('uxplimaNexusPass') ?: System.getenv('UXPLIMA_NEXUS_PASS')
            }
        }
    }
}
