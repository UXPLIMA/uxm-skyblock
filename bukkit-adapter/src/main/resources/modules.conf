# Which parts of the plugin run. A part turned off uses nothing: no listener, no timer, no cache.
# A change here needs a restart.

modules {
    # Islands themselves: creating, joining, homes and the grid. Every other module needs it.
    core = true

    # The island bank: money and crystals the members share (modules/bank.conf).
    bank = true

    # Upgrades an island buys: size, members, generator, warps and more (modules/upgrades.conf).
    upgrades = true

    # Changing the biome of an island (modules/biomes.conf).
    biomes = true

    # The kinds of island a player can start with (modules/presets.conf).
    presets = true

    # Seasons that end, pay the best islands and start again (modules/seasons.conf).
    seasons = true

    # Ratings and the guestbook (modules/social.conf).
    social = true

    # Messages to Discord webhooks (modules/discord.conf).
    discord = true

    # Alliances between islands (modules/alliances.conf).
    alliances = true

    # The island leaderboards, rebuilt on a schedule and announced when the leader changes.
    leaderboards = true

    # The island shop (modules/shop.conf).
    shop = true

    # /is trust (modules/temporary-access.conf).
    temporary-access = true

    # The reward inbox (modules/rewards.conf).
    rewards = true

    # Island warps (modules/warps.conf).
    warps = true

    # The shared island vault (modules/vault.conf).
    vault = true

    # Island chat (modules/chat.conf).
    chat = true

    # What happens to an island whose owner or whole team stops playing (modules/inactivity.conf).
    inactivity = true

    # /is admin freeze, which stops an island until staff lift it.
    admin-freeze = true

    # Island missions and challenges (modules/missions.conf).
    missions = true

    # The edge of an island: its border and what may cross it.
    boundary = true

    # Deleting and resetting islands, and giving their place on the grid to new ones.
    recycle = true

    # Island worth and level from the blocks it holds (modules/levels.conf).
    worth = true

    # The Nether and the End of each island (modules/dimensions.conf).
    dimensions = true

    # Limits on hoppers, pistons, spawners and creatures (modules/limits.conf).
    limits = true

    # Reset limits, quarantine and join cooldowns (modules/anti_abuse.conf).
    anti-abuse = true

    # Island boosters (modules/boosters.conf).
    boosters = true

    # Upkeep an island pays from its bank, and what happens when it cannot (modules/bank.conf).
    bank-upkeep = true
}

# Which module answers for a job two modules could do. The island bank is the bank module's.
capabilities {
    "island-bank" {
        selected-provider = "bank"
    }
}
