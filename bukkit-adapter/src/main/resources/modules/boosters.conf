# Boosters an island buys or is given: for a while, spawners, crops, the ore generator, mob
# experience or island worth count for more.
boosters {
    # true stops a booster's clock while none of the island's members is online.
    pause-when-empty = true

    # How often boosters that ran out are taken off.
    clean-interval = "60s"

    # How long a booster multiplier stays good enough to use without asking the database again.
    # A mob death has to know the multiplier before the event returns, so it reads this cache
    # instead of the database and refreshes it on a background thread. Lower means a booster takes
    # effect sooner after it is bought; higher means fewer queries under a mob farm.
    multiplier-cache-ttl = "5s"

    # One entry per kind of booster.
    #   enabled             false turns that kind off
    #   stack-mode          what a second booster of the same kind does while one runs:
    #                         DURATION    adds its time; the multiplier stays, up to max-duration
    #                         MULTIPLIER  adds its multiplier, up to max-multiplier
    #                         REPLACE     a stronger one takes the place of a weaker one
    #   duration-policy     with MULTIPLIER: INDEPENDENT lets each booster run out on its own,
    #                       REFRESH starts the whole stack's time again
    #   calculation         ADDITIVE adds what each booster adds (1.5x and 1.5x make 2.0x),
    #                       COMPOUND multiplies them (1.5x and 1.5x make 2.25x)
    #   max-multiplier      the most a stack of this kind reaches
    #   max-duration        the longest a stack of this kind runs
    categories {
        spawner_rate {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 5.0
            max-duration = "7d"
        }

        crop_growth {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 5.0
            max-duration = "7d"
        }

        ore_generator {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 5.0
            max-duration = "7d"
        }

        mob_exp {
            enabled = true
            stack-mode = "MULTIPLIER"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 4.0
            max-duration = "3d"
        }

        island_worth {
            enabled = true
            stack-mode = "DURATION"
            duration-policy = "INDEPENDENT"
            calculation = "ADDITIVE"
            max-multiplier = 3.0
            max-duration = "3d"
        }

        mission_rewards {
            enabled = true
            stack-mode = "MULTIPLIER"
            duration-policy = "REFRESH"
            calculation = "ADDITIVE"
            max-multiplier = 3.0
            max-duration = "3d"
        }
    }
}
