# The reward inbox: a reward a player could not be handed, because they were offline or their
# inventory was full, waits there until they claim it.

rewards {
    # false turns the inbox off.
    enabled = true

    # How often rewards that waited past their time are taken out of the inbox.
    expiry-check-interval = "5m"

    # How long a claim may sit unfinished before another claim may take it over.
    # A claim that is still working is well inside this window. A node that died
    # halfway through one is well outside it. Shorten it and two claims of one
    # reward can overlap; lengthen it and a crashed claim waits longer to be freed.
    claim-recovery-window = "2m"
}
