# Island worth and level: what each block an island holds adds, and how points become levels.

# How many points make one island level.
points-per-level = 100

# How much money in the island bank makes one point, in hundredths: 10000 is 100.00.
bank-minor-units-per-point = 10000

# The points a spawner adds when its creature is not listed under spawners below.
default-spawner-weight = 25

# The points each island mission finished once adds.
quest-weight = 50

# How long a leaderboard is answered from memory before it is built again.
# Building one is a sort across every island, and /is top and the web endpoint
# can both be asked for it as fast as anybody cares to. Shorten it and the board
# catches up sooner at the cost of more sorts; write 0 and it is built every time.
leaderboard-freshness = "60s"

# How often every board is built again in the background, so the first player to
# ask after a restart is not the one who pays for the sort. The announcement to
# Discord, if a webhook is set for it, goes out from here and only when the
# leading island has actually changed.
leaderboard-rebuild-interval = "5m"

# How long an island waits between two /is level recalculate runs. A rescan reads
# every block the island covers at every height, so a player who could send it
# as fast as they type could keep their whole region busy. Only one rescan of an
# island runs at a time whatever this says. Write 0 to drop the wait.
recalculation-cooldown = "60s"

# The share of each block's price under prices below that counts towards island worth, above 0
# and up to 1.
damping-factor = 0.85

