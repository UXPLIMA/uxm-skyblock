# Island warps: places on an island its team opens to visitors, who reach them from /is warps.

warps {
    # false turns island warps off.
    enabled = true

    # How many warps an island may open before the warp slots upgrade adds more.
    base-warp-limit = 2

    # How far, in blocks, around a warp a safe spot to land is looked for when the warp itself is
    # blocked or over a drop.
    search-radius = 5

    # A sign whose first line is the header and whose second is a name makes
    # a warp of that name where it stands, as /is setwarp does, with the same
    # role permission and the same limit. Breaking the sign deletes the warp.
    sign {
        enabled = true
        # Read in any case. Not [warp]: Essentials and its kind read that as a
        # server warp sign, and would take the sign for theirs.
        header = "[islandwarp]"
    }
}
