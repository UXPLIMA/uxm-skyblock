# What happens at the edge of an island, and on an island none of whose members is online.

# The edge of an island. A player who walks off it into the space between islands is stopped at the
# edge when this is true. A player with uxmskyblock.admin.bypass walks on.
border {
  stop-crossing = true
}

# While no member of an island is online, its redstone and its spawners rest, so an island nobody
# plays costs the server nothing. Both come back the moment a member joins.
offline-islands {
  # Redstone wire carries no current and pistons do not move.
  stop-redstone = true

  # Spawners spawn nothing.
  stop-spawners = true
}
