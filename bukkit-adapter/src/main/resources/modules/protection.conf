# Rules that keep a player from losing what they cannot get back.

# Lava that met water and turned to obsidian can be scooped back up with an empty bucket.
obsidian-recovery {
  enabled = true

  # true: only obsidian that formed from lava and water can be scooped, so obsidian a player
  # placed or mined cannot be turned into lava. false: any obsidian on an island can.
  accidental-only = true

  # How long, in seconds, obsidian that formed stays scoopable.
  expiration-seconds = 60
}

# A player who falls into the void is brought back to the island they fell from instead of dying.
void-recovery {
  enabled = true

  # Whether the island's own members are saved, and whether visitors are.
  members = true
  visitors = true

  # The height below which a falling player counts as lost. The world's floor on Paper 26 is -64.
  threshold-y = -64

  # Seconds after the rescue in which the player takes no fall damage.
  fall-damage-shield-seconds = 10

  # Seconds after the rescue in which no other player can hurt them. 0 for none.
  pvp-shield-seconds = 10
}

# Where a player lands from a teleport or an ender pearl, hostile mobs close by are pushed away, so
# nobody arrives inside a crowd of them. Nothing is killed or despawned.
kinetic-ward {
  enabled = true

  # How far, in blocks, from the landing spot mobs are pushed.
  radius = 5.0

  # How hard they are pushed away, and how far up. Higher values throw them further.
  repulsion-force = 1.5
  vertical-lift = 0.35
}
