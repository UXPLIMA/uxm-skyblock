# How many of the blocks and creatures that cost the server the most one island may hold. A player
# who places one past the limit is told so and the block or creature is not placed.
limits {
    enabled = true

    # A player with this node places past every limit.
    bypass-permission = "uxmskyblock.bypass.limits"

    # One entry per kind. The kinds are fixed: hoppers, pistons, sticky pistons, observers, droppers,
    # dispensers, brewing stands and spawners, then villagers, armor stands, minecarts and boats.
    #   base        how many an island holds with no upgrade
    #   upgrade-id  the upgrade in modules/upgrades.conf that raises it
    #   per-tier    how many each tier of that upgrade adds
    quotas {
        HOPPER {
            base = 50
            upgrade-id = "hopper_limit"
            per-tier = 50
        }
        PISTON {
            base = 32
            upgrade-id = "piston_limit"
            per-tier = 32
        }
        STICKY_PISTON {
            base = 32
            upgrade-id = "piston_limit"
            per-tier = 32
        }
        OBSERVER {
            base = 32
            upgrade-id = "redstone_limit"
            per-tier = 32
        }
        DROPPER {
            base = 32
            upgrade-id = "redstone_limit"
            per-tier = 32
        }
        DISPENSER {
            base = 32
            upgrade-id = "redstone_limit"
            per-tier = 32
        }
        BREWING_STAND {
            base = 16
            upgrade-id = "brewing_limit"
            per-tier = 16
        }
        SPAWNER {
            base = 25
            upgrade-id = "spawner_limit"
            per-tier = 25
        }
        VILLAGER {
            base = 20
            upgrade-id = "villager_limit"
            per-tier = 10
        }
        ARMOR_STAND {
            base = 30
            upgrade-id = "entity_limit"
            per-tier = 20
        }
        MINECART {
            base = 16
            upgrade-id = "entity_limit"
            per-tier = 16
        }
        BOAT {
            base = 16
            upgrade-id = "entity_limit"
            per-tier = 16
        }
    }
}
