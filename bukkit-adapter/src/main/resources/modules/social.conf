# Ratings and the guestbook: visitors rate an island and leave a line in its guestbook.

social {
  # How long a visitor must stay on an island before they may rate it.
  min-dwell-time = "30s"

  # An island's rating starts as prior-weight votes of prior-mean stars, so a few votes do not make
  # an island the best or the worst at once. Higher prior-weight moves it slower.
  prior-weight = 5
  prior-mean = 3.0

  # How many guestbook entries an island may pin to the top.
  max-pinned = 3

  # The longest a guestbook entry may be, in letters.
  max-message-length = 256
}
