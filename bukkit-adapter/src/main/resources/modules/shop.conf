# The island shop: members buy with the island bank and sell into it. Prices move with what players
# buy and sell.

shop {
    # false turns the island shop off.
    enabled = true

    # How much of a price move sticks, above 0 and up to 1. Lower values make prices move slower, so
    # buying a lot and selling it straight back earns nothing.
    damping-factor = 0.85

    # The stock-baseline of an item that writes none.
    default-stock-baseline = 100

    # The elasticity of an item that writes none.
    default-elasticity = 0.5

    # What the shop trades. Add a block and the shop trades it; remove one and it
    # does not. The key is the material's name.
    #
    # Only base-price has to be written. It is the price of one unit in minor
    # currency units, so 4000 is 40.00. floor-price and ceiling-price default to
    # half and double the base price, and elasticity and stock-baseline fall back
    # to the two settings above.
    #
    # elasticity is how hard the price moves as players buy and sell: a higher
    # number moves it further for the same volume. stock-baseline is the volume
    # that counts as one full move.
    items {
        COBBLESTONE {
            base-price = 100
            elasticity = 0.3
            stock-baseline = 5000
        }
        STONE {
            base-price = 150
            elasticity = 0.3
            stock-baseline = 5000
        }
        OAK_LOG {
            base-price = 400
            elasticity = 0.4
            stock-baseline = 2000
        }
        IRON_INGOT {
            base-price = 2500
            elasticity = 0.5
            stock-baseline = 1000
        }
        GOLD_INGOT {
            base-price = 4000
            elasticity = 0.5
            stock-baseline = 800
        }
        DIAMOND {
            base-price = 20000
            floor-price = 8000
            ceiling-price = 60000
            elasticity = 0.7
            stock-baseline = 200
        }
        EMERALD {
            base-price = 15000
            elasticity = 0.7
            stock-baseline = 200
        }
        WHEAT {
            base-price = 120
            elasticity = 0.4
            stock-baseline = 4000
        }
        SUGAR_CANE {
            base-price = 90
            elasticity = 0.4
            stock-baseline = 6000
        }
        NETHERITE_SCRAP {
            base-price = 80000
            floor-price = 40000
            ceiling-price = 250000
            elasticity = 0.9
            stock-baseline = 50
        }
    }
}
