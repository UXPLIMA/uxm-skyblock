# Alliances: islands that ally visit each other freely and share a chat.

alliances {
    # false turns alliances off.
    enabled = true

    # How many allies an island may have.
    max-allies = 2

    # How long an offer of alliance waits for an answer.
    invite-timeout = "5m"

    # How often the invitations nobody answered are deleted. An expired invite cannot be accepted,
    # so this only keeps the table from holding every invite the server has ever seen.
    expired-invite-sweep-interval = "5m"

    # true: members of allied islands cannot hurt each other.
    friendly-fire-shielding = true

    # true: allies may visit an island that is locked to visitors.
    privileged-visit-access = true

    # true opens /is allychat (or /is ac) to the allies.
    alliance-chat-enabled = true
}
