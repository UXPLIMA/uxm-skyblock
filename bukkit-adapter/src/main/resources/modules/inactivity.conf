# Islands whose people stopped playing. Once each interval the plugin looks at every island: one
# whose owner has been away too long passes to the next member, and one whose members have all
# been away too long is archived, or deleted with its space returned to the grid.
# /is admin inactivity scan looks at once.
inactivity {
    # Whether islands are looked at at all.
    enabled = true

    # How often, in seconds: 86400 is once a day.
    check-interval-seconds = 86400

    # How long the owner may be away before the island passes to another member.
    owner-inactivity-duration = "30d"

    # How long every member may be away before abandonment-action below happens.
    all-members-inactivity-duration = "60d"

    # Which roles the island may pass to, the first first: of the members still playing, the
    # longest serving one of the first role that has any becomes the owner. With none, the
    # island stays as it is.
    succession-hierarchy = ["CO_OWNER", "MODERATOR", "MEMBER"]

    # What becomes of the owner it passed from: DEMOTE_TO_CO_OWNER, DEMOTE_TO_MEMBER or
    # KICK_FROM_ISLAND.
    former-owner-action = "DEMOTE_TO_CO_OWNER"

    # What happens to an island nobody plays: ARCHIVE keeps it, DELETE_AND_RECYCLE deletes it and
    # gives its space back to the grid.
    abandonment-action = "ARCHIVE"
}
