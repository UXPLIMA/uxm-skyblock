        elsewhere = "<etag:'ERREUR'> <body>Un autre serveur travaille sur la cale de ce navire. Réessaie dans un instant."
        sealed = "<etag:'ERREUR'> <body>Rien n’entre ni ne sort d’une cale tant que tu tiens ce qu’un lieu créatif a fabriqué."
        full = "<etag:'ERREUR'> <body>La cale n’a pas de place pour ça."
        moved = "<etag:'ERREUR'> <body>Cette pile n’est plus là où elle était. Regarde de nouveau."
        offer_gone = "<etag:'ERREUR'> <body>Cette pile n’est plus dans ton inventaire."
        no_room = "<etag:'ERREUR'> <body>Tu n’as pas de place pour ça. Fais de la place et réessaie."
        left = "<etag:'ERREUR'> <body>Le déplacement n’a pas eu lieu."
        changed = "<etag:'ERREUR'> <body>Ton inventaire a changé pendant le déplacement. Rien n’a bougé, donc réessaie."
        not_saved = "<etag:'ERREUR'> <body>Le déplacement n’a pas pu être enregistré. Rien n’a bougé, donc réessaie."
        in_doubt = "<etag:'ERREUR'> <body>Le déplacement n’a pas pu être confirmé. Tu es retiré du serveur pour qu’il soit réglé. Reconnecte-toi."
