    # Le livre de légendes que lisent les joueurs d’une île Poseidon. Chaque ligne de pages est une page : écris-en
    # autant que tu veux. Un joueur Java lit un livre, un joueur Bedrock un formulaire, une page à la fois.
    lore {
        title = "La Chronique Noyée"
        author = "La Mer"
        previous = "Page précédente"
        next = "Page suivante"
        close = "Fermer"
        pages = [
            "<b>La Chronique Noyée</b>\n\nTu es né de la mer. L’eau est ton air, et le monde sec au-dessus est un désert qui brûle.",
            "<b>Respire</b>\n\nDans l’eau tu respires et tu vois. Hors de l’eau l’air te dessèche, et le soleil brûle davantage. La pluie te garde mouillé un moment.",
            "<b>Bouge</b>\n\nLa mer n’aime pas ce qui reste immobile. Reste trop longtemps au même endroit et elle t’arrache le souffle. Nage, creuse, construis, mais bouge.",
            "<b>Les épaves</b>\n\nDes navires gisent au fond autour de toi, et des ruines plus vieilles qu’eux. Leurs coffres gardent ce que les noyés ont laissé.",
            "<b>Les profondeurs inondées</b>\n\nMême le Nether est noyé pour les tiens. Là où d’autres trouvent le feu, tu retrouveras la mer."
        ]
        # Les chapitres de l’histoire, un par mission d’histoire nommée dans modules/poseidon.conf, chacun visible
        # une fois que le lecteur a accompli sa mission. Chaque ligne est une page.
        chapters {
            poseidon_story_1 = [
                "<b>Sel et pierre</b>\n\nLes éclats que tu as remis n’étaient pas de la pierre. C’étaient des écailles, perdues par quelque chose qui dort sous le fond de cette mer.",
                "Les anciens plongeurs l’appelaient le Gardien des Profondeurs. Ils disaient qu’il avait bâti les temples, et posté des veilleurs à chaque porte."
            ]
            poseidon_story_2 = [
                "<b>Les veilleurs</b>\n\nLes gardiens sont tombés, et leurs yeux se sont éteints. Ce n’étaient pas des bêtes. C’étaient des serrures, et tu en as ouvert dix."
            ]
            poseidon_story_3 = [
                "<b>Lanternes en bas</b>\n\nLes lanternes allumées, le chemin vers le bas se révèle : un escalier de prismarine, plus vieux que les épaves, qui descend là où aucune lumière n’est jamais allée."
            ]
            poseidon_story_4 = [
                "<b>Vieux filets</b>\n\nDans les filets est remonté un journal noyé. Sa dernière page dit : l’Ancien s’éveille quand les lanternes brûlent. Ne les allume pas."
            ]
            poseidon_story_5 = [
                "<b>L’ancien</b>\n\nL’Ancien n’est plus, et la mer est calme. Les temples sont à toi maintenant, et les profondeurs aussi. L’histoire s’achève, et la tienne commence."
            ]
        }
        # La page du premier chapitre pas encore trouvé. <mission> est la mission d’histoire qui le trouve.
        locked = "<b>Une page perdue</b>\n\nLe chapitre suivant est encore quelque part dans la mer.\n\nAccomplis <mission> pour le trouver."
    }
    # Le boss des profondeurs d’une île Poseidon : son nom, et ce que disent les listes d’effets de modules/effects.conf
    # quand il surgit, est tué ou replonge.
    boss {
        name = "<accent>L’Ancien des Profondeurs"
        rises = "<tag:'MER'> <body>Quelque chose d’ancien surgit des profondeurs. <accent>L’Ancien des Profondeurs</accent> est là."
        rises_title = "<accent>L’Ancien des Profondeurs"
        rises_subtitle = "<body>surgit des profondeurs"
        slain = "<tag:'MER'> <good>L’Ancien des Profondeurs est vaincu.<body> La mer est de nouveau calme."
        sinks = "<tag:'MER'> <body>L’Ancien des Profondeurs replonge dans l’obscurité."
    }
}

