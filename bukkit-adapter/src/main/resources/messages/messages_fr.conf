# Le mode de jeu OneBlock. Chaque phase de modules/oneblock.conf est titrée ici par son nom.
oneblock {
    # Dit au joueur dont le coup commence une nouvelle phase.
    phase_began = "<tag:'ONEBLOCK'> <body>Le bloc change, et <value><phase><body> commence."
    # Dit par la commande oneblock sur une île qui n’est pas une île OneBlock.
    not_oneblock = "<etag:'ERREUR'> <body>Ton île n’est pas une île OneBlock."
    # Dit par la commande oneblock quand son fichier de menu manque. Elle peut nommer chaque valeur que nomme le menu.
    standing = "<tag:'ONEBLOCK'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body> : <value><phase_blocks><body> blocs sur <value><phase_length><body>, <value><blocks_broken><body> cassés en tout."
    # La ligne d’un moment OneBlock au-dessus du bloc, comme la nomme un fichier de phase avec text = "@key".
    moments {
        plains_chest = "<value>Un coffre !<body> Ouvre-le avant les autres."
    }
    # Ce que demandent les lignes requires d’une phase, dit à celui qui casse pendant que l’île attend à la fin de la phase précédente.
    requires {
        missing = "<etag:'ONEBLOCK'> <body><value><phase><body> attend :"
        money = " <dim>•</dim> <money><amount></money> <muted>de ton argent"
        money_island = " <dim>•</dim> <money><amount></money> <muted>dans la banque de l’île"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>à toi"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>dans la banque de l’île"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>niveau d’île <level><needed>"
        permission = " <dim>•</dim> <muted>le droit <value><permission>"
        met = "<tag:'ONEBLOCK'> <body>Tout ce que demande <value><phase><body> est là, et elle commence."
    }
    # Dit par oneblock-lucky-break de modules/effects.conf sur un coup chanceux.
    lucky = "<tag:'ONEBLOCK'> <value>Un coup chanceux !<body> Quelque chose de bon est venu avec."
    # La progression de celui qui casse, sur la barre de boss ou la barre d’action, et où elle s’affiche. Elle peut nommer <phase>,
    # <broken> et <length>.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # La ligne au-dessus du bloc, dans la langue du serveur, tant que progress.line est actif.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'ONEBLOCK'> <body>Ta progression OneBlock s’affiche maintenant <value><bar><body>."
        names {
            bossbar = "sur une barre de boss"
            actionbar = "sur la barre d’action"
            none = "nulle part"
        }
    }
    # Dit à celui qui casse quand une créature hostile est tirée à l’avance. Peut nommer <creature> et <breaks>.
    creature_coming = "<etag:'ONEBLOCK'> <warn><creature><body> arrive dans <value><breaks><body> coups."
    # Les suites d’une phase qui bifurque, dites quand son fichier manque, et le choix.
    branch {
        offer = "<tag:'ONEBLOCK'> <value><phase><body> se termine ici. Sans choix, <value><first><body> est prise dans <value><time><body>. Les suites :"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'ONEBLOCK'> <body>Ton île passe de <value><phase><body> à <value><way><body>."
        taken = "<tag:'ONEBLOCK'> <body>Aucune suite n’a été choisie, donc ton île passe de <value><phase><body> à <value><way><body>."
    }
    # Le compte à rebours au-dessus du bloc d’une phase qui attend une fois commencée. Peut nommer <phase> et <time>.
    pause_line = "<value><phase>\n<body>commence dans <value><time>"
    # Une ligne que nomment avec "@key" les listes began, finished ou first-finished d’un fichier de phase.
    lists {
        plains_first = "<tag:'ONEBLOCK'> <body>Ton île a laissé la <value>Plaine<body> derrière elle pour la première fois."
    }
    phases {
        plains = "Plaine"
        underground = "Souterrain"
        snow = "Champs de neige"
        ocean = "Fond marin"
        jungle = "Jungle"
        nether = "Le Nether"
        end = "L’End"
    }
    # Ce que contient chaque phase fournie, comme le nomme l’aperçu de son fichier, affiché dans le menu des phases.
    previews {
        plains = "Herbe, terre et bois pour construire, animaux de ferme, et un coffre au trésor au 100e coup."
        underground = "Pierre et premiers minerais : charbon, fer, cuivre et or, avec des tonneaux de trésor."
        snow = "Neige, glace et sapin, avec du lapis-lazuli dans le froid."
        ocean = "Sable, argile et prismarine, lanternes aquatiques et éponges, et parfois un coffre d’épave."
        jungle = "Bois de jungle, mousse, pastèques et bambou, avec des émeraudes cachées dedans."
