# Messages en français.
#
# Chaque ligne est du MiniMessage, et chaque ligne nomme un rôle au lieu d’une couleur : <body> est
# le texte, <value> un nom ou un nombre, <money> une somme d’argent, <good> et <bad> un état, et
# <tag:'ÎLE'> l’étiquette qui ouvre une ligne du chat. Les couleurs derrière ces noms sont dans
# theme.conf, donc ce fichier n’en contient jamais.
#
# Écris ici des mots ordinaires. Le français s’affiche en petites capitales, pour que ce fichier
# reste lisible pour un traducteur ; é, è, à, ç et les autres lettres accentuées gardent leur forme.
# <plain> garde une commande ou un id en lettres ordinaires.
#
# Une clé que tu supprimes revient à la ligne intégrée au plugin, donc un joueur ne lit jamais une
# ligne vide. Copie ce fichier vers messages_<tag>.conf et traduis-le pour ajouter une langue.

