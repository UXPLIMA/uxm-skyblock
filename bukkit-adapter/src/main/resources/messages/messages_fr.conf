# Ce que dit /isadmin. <target> est le nom du joueur ou l’id de l’île que l’opérateur a tapé.
isadmin {
    oneblock {
        not_oneblock = "<etag:'ERREUR'> <value><target><body> n’est pas une île OneBlock."
        unknown_phase = "<etag:'ERREUR'> <body>Aucune phase ne s’appelle <value><phase><body>. Les phases sont <value><phases><body>."
        off_way = "<etag:'ERREUR'> <value><phase><body> n’est pas sur la voie choisie par l’île de <value><target><body>, donc elle ne peut pas s’y trouver."
        # Un compteur fixé ou augmenté. <was> et <now> sont les compteurs, <phase> la phase où elle se trouve maintenant.
        set = "<tag:'ONEBLOCK'> <value><target><body> a cassé <value><now><body> <muted>(avant <was>)<body> et se trouve dans <value><phase><body>. Son bloc est reposé."
        check = "<tag:'ONEBLOCK'> <value><target><body> : <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>, <value><phase_blocks><body> blocs sur <value><phase_length><body>, <value><blocks_broken><body> cassés en tout. Le bloc est à <value><at><body>."
        respawned = "<tag:'ONEBLOCK'> <body>Le bloc de <value><target><body> est reposé en <value><block><body>."
    }
    top {
        in_game = "<etag:'ERREUR'> <body>Tiens-toi, dans le jeu, là où va l’affichage."
        unknown_board = "<etag:'ERREUR'> <body>Aucun classement ne s’appelle <value><asked><body>. Les classements sont <value><boards><body>."
        bad_rank = "<etag:'ERREUR'> <body>Une place est un nombre entier de <value>1<body> à <value><most><body>."
        bad_kind = "<etag:'ERREUR'> <body>Un affichage est <value>sign<body>, <value>head<body> ou <value>text<body>."
        no_block = "<etag:'ERREUR'> <body>Regarde le panneau ou la tête sur lequel va l’affichage."
        # <kind> est sign, head ou text, <board> le classement, <position> la place affichée, <at> l’endroit.
        added = "<tag:'TOP'> <body>L’affichage <value><kind><body> à <value><at><body> montre la place <value><position><body> de <value><board><body>."
        removed = "<tag:'TOP'> <body>L’affichage à <value><at><body> est retiré."
        none_here = "<etag:'ERREUR'> <body>Aucun affichage là où tu regardes ou te tiens."
        listed_none = "<tag:'TOP'> <body>Aucun affichage n’est posé."
        listed = "<tag:'TOP'> <value><kind><body> à <value><at><body> : place <value><position><body> de <value><board>"
    }
    chunkblock {
        not_chunkblock = "<etag:'ERREUR'> <value><target><body> n’est pas une île ChunkBlock."
        # Dit à la console, qui ne se tient dans aucun chunk, quand elle n’en nomme aucun.
        name_the_chunk = "<etag:'ERREUR'> <body>Nomme le chunk par ses coordonnées : l’île, puis chunk x et chunk z."
        # <chunk> sont les coordonnées du chunk, x puis z.
        opened = "<tag:'CHUNK'> <body>Le chunk <value><chunk><body> de <value><target><body> est ouvert, et le reste quoi que fasse son niveau."
        refused {
            already_open = "<etag:'ERREUR'> <body>Le chunk <value><chunk><body> de <value><target><body> est déjà ouvert."
            not_beside_territory = "<etag:'ERREUR'> <body>Le chunk <value><chunk><body> n’est pas à côté des chunks ouverts de <value><target><body>."
            outside_island = "<etag:'ERREUR'> <body>Le chunk <value><chunk><body> est hors de l’île de <value><target><body>."
            taken = "<etag:'ERREUR'> <body>Un autre changement sur <value><target><body> est arrivé avant. Réessaie."
            level_too_low = "<etag:'ERREUR'> <body>Le chunk <value><chunk><body> de <value><target><body> n’a pas pu être ouvert."
        }
        closed = "<tag:'CHUNK'> <body>Le chunk <value><chunk><body> de <value><target><body> est fermé, et ceux qui s’y trouvaient ont été déplacés."
        not_open = "<etag:'ERREUR'> <body>Le chunk <value><chunk><body> de <value><target><body> n’est pas un chunk qui peut se fermer : il est fermé, ou c’est le premier de l’île."
        cuts_off = "<etag:'ERREUR'> <body>Fermer le chunk <value><chunk><body> isolerait d’autres chunks ouverts de <value><target><body>. Ferme-les d’abord."
        reset = "<tag:'CHUNK'> <body><value><count><body> chunks de <value><target><body> sont fermés. Seul le premier est ouvert."
    }
    tradewinds {
        not_vessel = "<etag:'ERREUR'> <value><target><body> n’est pas un navire TradeWinds."
        unknown_rank = "<etag:'ERREUR'> <body>Aucun rang ne s’appelle <value><asked><body>. Les rangs sont <value><ranks><body>."
        unknown_port = "<etag:'ERREUR'> <body>Aucun port ne s’appelle <value><port><body>. Les ports sont <value><ports><body>."
        # <vessel_rank> est le nom du rang, <rows> le nombre de rangées de sa cale.
        ranked = "<tag:'MER'> <value><target><body> est maintenant un <rank><vessel_rank><body>, sa cale de <value><rows><body> rangées."
        standing = "<tag:'MER'> <body>La réputation de <value><target><body> à <value><port><body> est maintenant <value><standing><body>."
        moved = "<tag:'MER'> <value><target><body> est maintenant à <value><port><body>."
        held_elsewhere = "<etag:'ERREUR'> <body>Un autre serveur détient <value><target><body> en ce moment. Réessaie dans un instant."
    }
    realms {
        not_realms = "<etag:'ERREUR'> <value><target><body> n’est pas une île StrangerRealms."
        # <world> est le monde qui n’est pas chargé : la terre de l’île, ou le Monde à l’envers.
        not_loaded = "<etag:'ERREUR'> <body>Le monde <value><world><body> n’est pas chargé, donc le Monde à l’envers de <value><target><body> ne peut pas être posé."
        outside = "<etag:'ERREUR'> <body>Le chunk <value><chunk><body> est hors de l’île de <value><target><body>."
        remirrored = "<tag:'ADMIN'> <value><count><body> chunks du Monde à l’envers de <value><target><body> sont reposés depuis sa terre."
    }
    brix {
        # <theme> est le thème tel qu’écrit dans modules/brix.conf ou dans la commande.
        opened = "<tag:'ADMIN'> <body>Un concours de construction sur <value><theme><body> est ouvert."
        under_way = "<etag:'ERREUR'> <body>Un concours de construction est déjà en cours. Annule-le d’abord."
        none = "<etag:'ERREUR'> <body>Aucun concours de construction n’est en cours."
        closed = "<tag:'ADMIN'> <body>Le concours de construction sur <value><theme><body> est annulé, avec ses inscriptions et ses votes."
        no_theme = "<etag:'ERREUR'> <body>Nomme un thème : <plain>modules/brix.conf</plain> n’en liste aucun."
    }
    parkour {
        not_course = "<etag:'ERREUR'> <value><target><body> n’est pas un parcours de Parkour."
        unknown_runner = "<etag:'ERREUR'> <body>Aucun joueur nommé <value><runner><body> n’est venu sur ce serveur."
        # <count> est le nombre de coureurs dont les records sont partis.
        reset = "<tag:'PARKOUR'> <body>Les courses sur <value><target><body> sont oubliées : <value><count><body> coureurs repartent de zéro."
        reset_runner = "<tag:'PARKOUR'> <body>Les courses de <value><runner><body> sur <value><target><body> sont oubliées. Sa prochaine arrivée est une première."
    }
    loot {
        in_game = "<etag:'ERREUR'> <body>Marque un conteneur dans le jeu, en le regardant."
        unknown_table = "<etag:'ERREUR'> <body>Aucune table de butin ne s’appelle <value><table><body>. Les tables sont <value><tables><body>."
        no_container = "<etag:'ERREUR'> <body>Regarde un coffre, un tonneau ou un autre conteneur proche."
        # <at> est l’endroit où se trouve le conteneur, x, y et z.
        marked = "<tag:'ADMIN'> <body>Le conteneur à <value><at><body> est rempli depuis <value><table><body> la première fois qu’un joueur l’ouvre."
    }
    boxed {
        not_boxed = "<etag:'ERREUR'> <value><target><body> n’est pas une île Boxed."
        # <min> et <max> sont la plus petite et la plus grande boîte, en largeur.
        size_range = "<etag:'ERREUR'> <body>Une boîte fait de <value><min><body> à <value><max><body> de large, pas <value><size><body>."
        changed = "<tag:'BOÎTE'> <body>La boîte de <value><target><body> fait maintenant <value><size>×<size><body> <muted>(avant <was>×<was>)<body>."
    }
}

