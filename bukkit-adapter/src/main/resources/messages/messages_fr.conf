# ==============================================================================
# Mots des menus.
#
# Chaque fichier de menu dans menus/ nomme ses titres, noms d’objets et descriptions par
# ces clés, donc un serveur qui livre une deuxième langue a ses menus dans cette langue.
# Une ligne ici peut porter une valeur vivante avec laquelle le menu a été ouvert : elle s’écrit
# <argument_<name>>, les mêmes noms qu’un fichier de menu écrit %argument_<name>%.
# ==============================================================================
menu {
    # Les deux mots que chaque case écrit au-dessus de sa description et de ses informations, les mêmes dans chaque fenêtre.
    lore {
        description = "Description"
        details = "Détails"
    }

    oneblock {
        title = "OneBlock"
