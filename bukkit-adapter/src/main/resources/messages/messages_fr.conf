parkour {
    # Dit quand un joueur entre sur un parcours de Parkour et que ce qu’il apporte est mis de côté.
    kept = "<tag:'PARKOUR'> <body>Tes objets sont gardés en sécurité tant que tu es sur ce parcours."
    # Dit quand un joueur quitte un parcours de Parkour et récupère ce qu’il avait apporté.
    given_back = "<tag:'PARKOUR'> <body>Tu as récupéré tes objets."
    # Dit quand une course commence sur la plaque de départ.
    started = "<tag:'PARKOUR'> <body>La course est <good>lancée<body>. Atteins la plaque d’arrivée."
    # Dit à un point de contrôle.
    checkpoint = "<tag:'PARKOUR'> <body>Point de contrôle."
    # Dit à un point de contrôle que la course atteint pour la première fois, quand le meilleur temps du coureur ne l’avait pas atteint : la durée de la course.
    split = "<tag:'PARKOUR'> <body>Point de contrôle à <value><time><body>."
    # Dit à un point de contrôle aussi rapide que le meilleur du coureur à cet endroit, ou plus : <diff> est l’écart.
    split_ahead = "<tag:'PARKOUR'> <body>Point de contrôle à <value><time><body>, <good><diff><body> d’avance sur ton meilleur temps."
    # Dit à un point de contrôle plus lent que le meilleur du coureur à cet endroit : <diff> est l’écart.
    split_behind = "<tag:'PARKOUR'> <body>Point de contrôle à <value><time><body>, <bad><diff><body> de retard sur ton meilleur temps."
    # Dit quand un coureur tombé est remis au dernier point de contrôle.
    returned = "<tag:'PARKOUR'> <body>Retour à ton dernier point de contrôle."
    # Dit à l’arrivée quand la base de données n’a pas pu être lue.
    finished = "<tag:'PARKOUR'> <body>Tu as fini en <value><time><body>."
    # Dit à la première arrivée d’un coureur sur le parcours.
    first = "<tag:'PARKOUR'> <body>Tu as fini en <value><time><body>, ta première fois sur ce parcours."
    # Dit quand un coureur bat son meilleur temps.
    beaten = "<tag:'PARKOUR'> <body>Un nouveau meilleur temps de <good><time><body>, contre <value><was><body> avant."
    # Dit quand un coureur est plus lent que son meilleur temps.
    slower = "<tag:'PARKOUR'> <body>Tu as fini en <value><time><body>. Ton meilleur temps est <value><best><body>."
    # Dit quand une arrivée est plus rapide que quiconque n’a couru le parcours, la première arrivée comprise.
    course_record = "<tag:'PARKOUR'> <good>Un record du parcours<body> : personne ne l’a couru plus vite que <value><time><body>."
    # Dit quand une course dure plus longtemps que la limite.
    timed_out = "<tag:'PARKOUR'> <body>La course a duré trop longtemps et est <bad>terminée<body>."
    # Dit quand un coureur quitte le parcours.
    left = "<tag:'PARKOUR'> <body>Tu as quitté le parcours, donc la course est <bad>terminée<body>."
    # Dit quand une course se termine pour un contrôle enfreint.
    check {
        flight = "<tag:'PARKOUR'> <body>Pas de vol pendant une course. La course est <bad>terminée<body>."
        teleport = "<tag:'PARKOUR'> <body>Tu as été déplacé hors du tracé du parcours. La course est <bad>terminée<body>."
        speed = "<tag:'PARKOUR'> <body>C’était plus rapide que quiconque ne court. La course est <bad>terminée<body>."
    }
    # Dit quand une course commence contre un fantôme : un objet que seul le coureur voit refait une course de <time>.
    ghost = "<tag:'PARKOUR'> <body>Un fantôme court à côté de toi et finit en <value><time><body>. Bats-le."
    # Dit par la commande course hors d’un parcours de Parkour.
    not_course = "<etag:'ERREUR'> <body>Tu n’es pas sur un parcours de Parkour."
    # L’en-tête de la commande course.
    top_header = "<h:'Meilleurs temps ici'>"
    # Un coureur dans la commande course, le plus rapide d’abord.
    top_entry = " <muted>#<place></muted> <body><player></body> <value><time></value> <muted>(<runs> courses)"
    # Dit par la commande course quand personne n’a fini le parcours.
    top_empty = "<tag:'PARKOUR'> <body>Personne n’a encore fini ce parcours."
    # La ligne d’étiquettes du tableau du parcours : <difficulty> et <category>, chacune un mot ci-dessous ou le nom tel qu’écrit.
    about_tags = "<muted>Difficulté</muted> <value><difficulty></value> <muted>Catégorie</muted> <value><category></value>"
    # La note du tableau du parcours : <rating> étoiles sur <most> en moyenne, par <count> coureurs.
    about_rating = "<muted>Noté</muted> <value><rating></value><muted>/<most> par <count> coureurs</muted>"
    # Le tableau du parcours quand aucun coureur ne l’a noté.
    about_unrated = "<muted>Pas encore noté.</muted>"
    tag {
        # Dit pour une étiquette que le parcours n’a pas reçue.
        none = "aucune"
        # Dit quand l’étiquette du parcours est fixée : <tag>.
        set {
            difficulty = "<tag:'PARKOUR'> <body>Ce parcours est maintenant <value><tag><body>."
            category = "<tag:'PARKOUR'> <body>Ce parcours est maintenant dans <value><tag><body>."
        }
        # Dit quand l’étiquette du parcours est retirée.
        cleared {
            difficulty = "<tag:'PARKOUR'> <body>Ce parcours n’a plus de difficulté."
            category = "<tag:'PARKOUR'> <body>Ce parcours n’a plus de catégorie."
        }
        # Dit quand le nom n’est aucun de ceux que liste l’opérateur : <name>, et <choices>, ceux qu’il liste.
        unknown = "<etag:'ERREUR'> <body><value><name><body> n’en fait pas partie. Choisis parmi <value><choices><body>."
        # Dit à un joueur qui n’est pas de l’équipe du parcours, ou qui ne peut pas changer ses paramètres.
        not_team = "<etag:'ERREUR'> <body>Seule l’équipe du parcours peut l’étiqueter."
        # Dit quand les étiquettes n’ont pas pu être écrites.
        failed = "<etag:'ERREUR'> <body>Le parcours n’a pas pu être étiqueté. Réessaie."
    }
    rate {
        # Dit quand le parcours est noté : <stars> sur <most>.
        done = "<tag:'PARKOUR'> <body>Tu as noté ce parcours <value><stars><body> sur <value><most><body>."
        # Dit à un coureur qui n’a pas fini le parcours.
        not_finished = "<etag:'ERREUR'> <body>Finis le parcours avant de le noter."
        # Dit à la propre équipe du parcours.
        own = "<etag:'ERREUR'> <body>Tu ne peux pas noter ton propre parcours."
        # Dit quand les étoiles sont hors de 1 à <most>.
        range = "<etag:'ERREUR'> <body>Note-le de <value>1<body> à <value><most><body>."
        # Dit quand l’opérateur a désactivé les notes.
        off = "<etag:'ERREUR'> <body>Les parcours ne sont pas notés sur ce serveur."
        # Dit quand la note n’a pas pu être écrite.
        failed = "<etag:'ERREUR'> <body>La note n’a pas pu être gardée. Réessaie."
    }
    # Les difficultés de modules/parkour.conf, par nom. Un nom absent d’ici s’affiche tel qu’il est écrit.
    difficulties {
        easy = "Facile"
        medium = "Moyen"
        hard = "Difficile"
        expert = "Expert"
    }
    # Les catégories de modules/parkour.conf, par nom. Un nom absent d’ici s’affiche tel qu’il est écrit.
    categories {
        classic = "Classique"
        speed = "Vitesse"
        maze = "Labyrinthe"
        dropper = "Dropper"
        puzzle = "Énigme"
    }
    courses {
        title = "Parcours de Parkour"
        # La case d’un parcours. <entry_name> est le nom de son île, ou unnamed ci-dessous.
        course {
            title = "<entry_name>"
            crumb = "Parcours de Parkour"
            description = "Sur l’île de <entry_owner>."
            difficulty { label = "Difficulté", value = "<value><entry_difficulty>" }
            category { label = "Catégorie", value = "<value><entry_category>" }
            rating { label = "Noté", value = "<value><entry_rating> <muted>(<entry_ratings>)" }
            record { label = "Record", value = "<value><entry_record>" }
            runs { label = "Courses", value = "<value><entry_runs>" }
            visit = "<cta>Clique<subtext> pour y aller."
        }
        # Le nom d’un parcours dont l’île n’en a pas : <owner> est le propriétaire de l’île.
        unnamed = "Parcours de <owner>"
        # Un parcours que personne n’a noté.
        unrated = "pas encore"
        # Un parcours que personne n’a fini.
        unfinished = "pas encore"
        # Dit quand le serveur n’a aucun parcours de Parkour.
        none = "<tag:'PARKOUR'> <body>Il n’y a encore aucun parcours de Parkour."
        # Dit quand les parcours n’ont pas pu être lus.
        failed = "<etag:'ERREUR'> <body>Les parcours n’ont pas pu être lus. Réessaie."
        no_window = "<etag:'ERREUR'> <body>La fenêtre des parcours manque. Demande au serveur de restaurer <plain>menus/parkour-courses.conf</plain>."
    }
    # Les temps de chaque saison que tient le système de saisons, chacune son propre classement.
    season {
        # <season> est le nom de la saison tel que l’écrit le système de saisons.
        header = "<accent><season> : les meilleurs temps"
        empty = "<tag:'PARKOUR'> <body>Personne n’a encore fini ce parcours pendant <accent><season></accent>."
        none = "<tag:'PARKOUR'> <body>Aucune saison n’est en cours."
        unknown = "<tag:'PARKOUR'> <body>Il n’y a pas de saison <accent><number></accent>."
        # Dit quand une arrivée prend la tête de la saison en cours : <time> est la course, <season> le nom de la saison.
        record = "<tag:'PARKOUR'> <good>Un record de saison<body> : <accent><time></accent> mène <accent><season></accent>."
    }
}
