        held_elsewhere = "<etag:'ERRO'> <body>Outro servidor está com <value><target><body> agora. Tente de novo daqui a pouco."
    }
    realms {
        not_realms = "<etag:'ERRO'> <value><target><body> não é uma ilha StrangerRealms."
        # <world> é o mundo que não está carregado: a terra da ilha, ou o Mundo Invertido.
        not_loaded = "<etag:'ERRO'> <body>O mundo <value><world><body> não está carregado, então o Mundo Invertido de <value><target><body> não pode ser refeito."
        outside = "<etag:'ERRO'> <body>O chunk <value><chunk><body> está fora da ilha de <value><target><body>."
        remirrored = "<tag:'ADMIN'> <value><count><body> chunks do Mundo Invertido de <value><target><body> foram refeitos a partir da terra dela."
    }
    brix {
        # <theme> é o tema como escrito em modules/brix.conf ou no comando.
        opened = "<tag:'ADMIN'> <body>Um concurso de construção sobre <value><theme><body> está aberto."
        under_way = "<etag:'ERRO'> <body>Um concurso de construção já está em andamento. Cancele primeiro."
        none = "<etag:'ERRO'> <body>Nenhum concurso de construção está em andamento."
        closed = "<tag:'ADMIN'> <body>O concurso de construção sobre <value><theme><body> foi cancelado, com as inscrições e os votos."
        no_theme = "<etag:'ERRO'> <body>Cite um tema: <plain>modules/brix.conf</plain> não lista nenhum."
    }
    parkour {
        not_course = "<etag:'ERRO'> <value><target><body> não é um percurso de Parkour."
        unknown_runner = "<etag:'ERRO'> <body>Nenhum jogador chamado <value><runner><body> passou por este servidor."
        # <count> é quantos corredores perderam os registros.
        reset = "<tag:'PARKOUR'> <body>As corridas em <value><target><body> foram esquecidas: <value><count><body> corredores começam de novo."
        reset_runner = "<tag:'PARKOUR'> <body>As corridas de <value><runner><body> em <value><target><body> foram esquecidas. A próxima chegada dele é a primeira."
    }
    loot {
        in_game = "<etag:'ERRO'> <body>Marque um contêiner dentro do jogo, olhando para ele."
        unknown_table = "<etag:'ERRO'> <body>Nenhuma tabela de saque se chama <value><table><body>. As tabelas são <value><tables><body>."
        no_container = "<etag:'ERRO'> <body>Olhe para um baú, um barril ou outro contêiner por perto."
        # <at> é onde o contêiner está, x, y e z.
        marked = "<tag:'ADMIN'> <body>O contêiner em <value><at><body> é enchido a partir de <value><table><body> na primeira vez que um jogador o abre."
    }
    boxed {
        not_boxed = "<etag:'ERRO'> <value><target><body> não é uma ilha Boxed."
        # <min> e <max> são a menor e a maior caixa, de lado a lado.
        size_range = "<etag:'ERRO'> <body>Uma caixa tem de <value><min><body> a <value><max><body> de lado, não <value><size><body>."
        changed = "<tag:'CAIXA'> <body>A caixa de <value><target><body> agora tem <value><size>×<size><body> <muted>(antes <was>×<was>)<body>."
    }
}

stacking {
    line = "<value>×<size>"
}

# Uma exibição de ranking. <position> é a posição, <board> o ranking, <island> o nome da ilha, <owner> o
# dono dela, <score> a pontuação dela. Uma posição que ninguém ocupa ainda mostra empty.
top_display {
    sign {
        line1 = "<tag:'#<position>'>"
        line2 = "<value><island>"
        line3 = "<body><owner>"
        line4 = "<money><score>"
    }
    sign_empty {
        line1 = "<tag:'#<position>'>"
        line2 = "<muted>Ninguém ainda"
        line3 = ""
        line4 = ""
    }
    text = "<tag:'#<position>'> <body><board><newline><value><island><newline><body><owner> <muted>· <money><score>"
    text_empty = "<tag:'#<position>'> <body><board><newline><muted>Ninguém ainda"
}

visitors {
    command_blocked = "<etag:'ERRO'> <body>Visitantes não podem usar <value>/<command><body> nesta ilha."
}

visit_fee {
    asks = "<tag:'VISITA'> <body>Esta ilha cobra <money><amount><body> por visita. Digite <value><command><body> para pagar e ir."
    paid = "<tag:'VISITA'> <body>Você pagou <money><amount><body> ao banco da ilha."
    unaffordable = "<etag:'ERRO'> <body>Você não pode pagar os <money><amount><body> que esta ilha cobra por visita."
    failed = "<etag:'ERRO'> <body>A taxa não pôde ser paga, então nada foi cobrado. Tente de novo."
    disabled = "<etag:'ERRO'> <body>As ilhas não cobram visitantes neste servidor."
    no_island = "<etag:'ERRO'> <body>Você precisa de uma ilha própria para isso."
    no_permission = "<etag:'ERRO'> <body>Seu cargo nesta ilha não pode definir a taxa de visita dela."
    out_of_range = "<etag:'ERRO'> <body>Uma taxa de visita vai de nada até <money><most><body>."
    none = "<tag:'VISITA'> <body>Sua ilha não cobra nada dos visitantes. Ela pode cobrar até <money><most><body>."
    shown = "<tag:'VISITA'> <body>Sua ilha cobra <money><amount><body> dos visitantes."
    set = "<tag:'VISITA'> <body>Os visitantes agora pagam <money><amount><body> ao banco da sua ilha."
    cleared = "<tag:'VISITA'> <body>Os visitantes agora não pagam nada."
}

block_values {
    title = "Valores dos blocos"
    # O bloco de um bloco. <entry_name> é o bloco no idioma do próprio leitor.
    block {
        title = "<entry_name>"
        crumb = "Valor do bloco"
        description = "O que um destes soma a uma ilha."
        worth { label = "Valor", value = "<money><entry_worth>" }
        points { label = "Pontos", value = "<value><entry_points>" }
        level { label = "Níveis", value = "<value><entry_level>" }
    }
    # Dito quando levels.conf não dá valor a nenhum bloco.
    none = "<tag:'VALOR'> <body>Nenhum bloco vale nada neste servidor."
    disabled = "<etag:'ERRO'> <body>O valor das ilhas está desligado neste servidor."
    no_window = "<etag:'ERRO'> <body>A janela dos valores dos blocos está faltando. Peça ao servidor para restaurar <plain>menus/block-values.conf</plain>."
}

# As palavras com que os rankings de ilhas respondem: uma posição que ninguém ocupa, um valor que não existe, e o
# tempo até um ranking recomeçar.
placeholder {
    nobody = "Ninguém"
    none = "-"
    resets_days = "<days>d <hours>h"
    resets_hours = "<hours>h <minutes>min"
    resets_minutes = "<minutes>min"
}

