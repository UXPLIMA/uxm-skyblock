# ==============================================================================
# Palavras dos menus.
#
# Cada arquivo de menu em menus/ nomeia seus títulos, nomes de itens e descrições por meio
# destas chaves, então um servidor que traz um segundo idioma tem os menus nele.
# Uma linha aqui pode levar um valor vivo com que o menu foi aberto: ela escreve
# <argument_<name>>, os mesmos nomes que um arquivo de menu escreve como %argument_<name>%.
# ==============================================================================
menu {
    # As duas palavras que cada bloco escreve acima da descrição e dos dados, iguais em toda janela.
    lore {
        description = "Descrição"
        details = "Detalhes"
    }

    oneblock {
        title = "OneBlock"
        note = "<tag:'ONEBLOCK'> <body>Quebre o bloco para avançar pelas fases."
        phase {
            title = "<argument_phase>"
            crumb = "OneBlock"
            description = "A fase em que o bloco está agora. Cada uma traz seus próprios blocos e criaturas."
            number { label = "Fase", value = "<value><argument_phase_number>/<argument_phase_count>" }
            action = "<cta>Clique<subtext> para ver cada fase"
        }
        progress {
            title = "Esta fase"
            crumb = "OneBlock"
            description = "Quanto da fase sua ilha já percorreu."
            percent { label = "Percorrido", value = "<level><argument_phase_percent>%" }
            broken { label = "Quebrados", value = "<value><argument_phase_blocks>/<argument_phase_length>" }
            left { label = "Faltam", value = "<value><argument_phase_left>" }
            next { label = "Depois", value = "<value><argument_next_phase>" }
        }
        bar {
            title = "Seu progresso"
            crumb = "OneBlock"
            description = "Onde o progresso da sua ilha aparece enquanto você quebra o bloco dela."
            where { label = "Aparece", value = "<value><argument_bar>" }
            action = "<cta>Clique<subtext> para mostrar em outro lugar"
        }
        broken {
            title = "Cada quebra"
            crumb = "OneBlock"
            description = "Cada bloco que sua ilha quebrou desde o começo, e quem quebrou."
            total { label = "Quebrados", value = "<value><argument_blocks_broken>" }
            mine { label = "Por você", value = "<value><argument_my_breaks>" }
            top { label = "Quem mais quebrou", value = "<value><argument_top_member> <muted><argument_top_member_breaks>" }
        }
    }
    oneblock_phases {
        title = "Cada fase"
        summary {
            title = "<argument_phase>"
            crumb = "OneBlock"
            description = "A fase em que sua ilha está agora. As fases alcançadas estão acesas, as próximas estão bloqueadas."
        }
        phase {
            title = "<entry_phase>"
            crumb = "Fase"
