        already = "<tag:'BRIX'> <bad>Este lote já está inscrito."
        not_building = "<tag:'BRIX'> <bad>Os lotes só são inscritos enquanto o concurso está na fase de construção."
        not_voting = "<tag:'BRIX'> <bad>Os votos só são aceitos depois que a construção termina, até os votos acabarem."
        not_entered = "<tag:'BRIX'> <bad>Este lote não está inscrito no concurso."
        own_plot = "<tag:'BRIX'> <bad>Você não pode votar em um lote da sua própria equipe."
        bad_stars = "<tag:'BRIX'> <bad>Dê de 1 a <most> estrelas."
        voted = "<tag:'BRIX'> <good>Você deu <stars> estrelas a este lote. <body>Você pode mudar até os votos acabarem."
        failed = "<tag:'BRIX'> <bad>O concurso não pôde ser alcançado. Tente de novo."
        # Os temas de modules/brix.conf, por nome. Um tema que não está aqui aparece como foi escrito.
        themes {
            lighthouse = "Um farol"
