            crumb = "Percurso de Parkour"
            description = "Na ilha de <entry_owner>."
            difficulty { label = "Dificuldade", value = "<value><entry_difficulty>" }
            category { label = "Categoria", value = "<value><entry_category>" }
            rating { label = "Avaliado", value = "<value><entry_rating> <muted>(<entry_ratings>)" }
            record { label = "Recorde", value = "<value><entry_record>" }
