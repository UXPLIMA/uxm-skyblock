            poseidon_story_3 = [
                "<b>Lanternas lá embaixo</b>\n\nCom as lanternas acesas, o caminho para baixo aparece: uma escada de prismarinho, mais antiga que os naufrágios, indo para onde nenhuma luz chegou."
