        opened = "<tag:'BRIX'> <good>Um concurso de construção começou! <body>O tema é <accent><theme><body>. Inscreva seu lote com <value><cmd:'contest join'><body> em até <value><days>d <hours>h <minutes>min<body>."
        # Dito a todos quando a construção termina e os votos começam.
        votes_open = "<tag:'BRIX'> <body>A construção sobre <accent><theme><body> acabou. Visite os lotes inscritos, <value><entered><body> no total, e dê a cada um de 1 a <value><most><body> estrelas com <value><cmd:'contest vote'><body>, por <value><days>d <hours>h <minutes>min<body>."
