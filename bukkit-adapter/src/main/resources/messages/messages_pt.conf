# Mensagens em português.
#
# Cada linha é MiniMessage, e cada linha nomeia um papel em vez de uma cor: <body> é o texto,
# <value> um nome ou um número, <money> uma quantia de dinheiro, <good> e <bad> um estado, e
# <tag:'ILHA'> a etiqueta que abre uma linha do chat. As cores por trás desses nomes ficam em
# theme.conf, então este arquivo nunca tem uma.
#
# Escreva aqui palavras comuns. O português aparece em versaletes, para que este arquivo continue
# legível para um tradutor; á, ã, ç e as outras letras acentuadas mantêm sua forma. <plain> deixa
# um comando ou um id em letras comuns.
#
# Uma chave que você apagar volta para a linha embutida no plugin, então um jogador nunca lê uma
# linha vazia. Copie este arquivo para messages_<tag>.conf e traduza para adicionar um idioma.

