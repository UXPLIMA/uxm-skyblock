    # As dificuldades de modules/parkour.conf, por nome. Um nome que não está aqui aparece como foi escrito.
    difficulties {
        easy = "Fácil"
        medium = "Médio"
        hard = "Difícil"
        expert = "Especialista"
    }
    # As categorias de modules/parkour.conf, por nome. Um nome que não está aqui aparece como foi escrito.
    categories {
        classic = "Clássico"
        speed = "Velocidade"
        maze = "Labirinto"
        dropper = "Dropper"
        puzzle = "Quebra-cabeça"
    }
    courses {
