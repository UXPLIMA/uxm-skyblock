        building = "<tag:'BRIX'> <body>Um concurso de construção sobre <accent><theme><body> está em andamento. Lotes inscritos: <value><entered><body>. A construção termina em <value><days>d <hours>h <minutes>min<body>. Fique no seu lote e digite <value><cmd:'contest join'><body> para inscrevê-lo."
