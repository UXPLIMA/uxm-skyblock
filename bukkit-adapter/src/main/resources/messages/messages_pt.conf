        place = "<body>  <accent>#<place></accent> o lote de <value><owner></value>: <value><average></value> estrelas, votos: <value><votes></value>"
        ended_empty = "<tag:'BRIX'> <body>O concurso de construção sobre <accent><theme><body> acabou, e nenhum lote foi inscrito."
        # <min> é o mínimo de votos que um lote precisa para ser classificado.
        ended_unplaced = "<tag:'BRIX'> <body>O concurso de construção sobre <accent><theme><body> acabou. Nenhum lote recebeu os <value><min><body> votos necessários para ser classificado."
