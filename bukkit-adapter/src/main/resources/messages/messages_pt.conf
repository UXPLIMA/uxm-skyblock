    }
    # Os tempos de cada temporada que o sistema de temporadas mantém, cada uma com o próprio ranking.
    season {
        # <season> é o nome da temporada como o sistema de temporadas escreve.
        header = "<accent><season>: os melhores tempos"
        empty = "<tag:'PARKOUR'> <body>Ninguém terminou este percurso em <accent><season></accent> ainda."
        none = "<tag:'PARKOUR'> <body>Não há nenhuma temporada em andamento."
        unknown = "<tag:'PARKOUR'> <body>Não existe a temporada <accent><number></accent>."
