                "Os velhos mergulhadores chamavam isso de Guardião das Profundezas. Diziam que ele construiu os templos, e colocou vigias em cada porta."
            ]
            poseidon_story_2 = [
                "<b>Os vigias</b>\n\nOs guardiões caíram, e os olhos deles se apagaram. Não eram feras. Eram fechaduras, e você abriu dez delas."
