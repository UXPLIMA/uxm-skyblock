# O modo de jogo OneBlock. Cada fase de modules/oneblock.conf recebe aqui um título pelo nome dela.
oneblock {
    # Dito ao jogador cuja quebra começa uma fase nova.
    phase_began = "<tag:'ONEBLOCK'> <body>O bloco muda, e <value><phase><body> começa."
    # Dito pelo comando oneblock em uma ilha que não é uma ilha OneBlock.
    not_oneblock = "<etag:'ERRO'> <body>Sua ilha não é uma ilha OneBlock."
    # Dito pelo comando oneblock quando o arquivo de menu dele está faltando. Pode citar cada valor que o menu cita.
    standing = "<tag:'ONEBLOCK'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>: <value><phase_blocks><body> de <value><phase_length><body> blocos, <value><blocks_broken><body> quebrados no total."
    # A linha de um momento do OneBlock sobre o bloco, como um arquivo de fase a cita com text = "@key".
    moments {
        plains_chest = "<value>Um baú!<body> Abra antes de todo mundo."
    }
    # O que as linhas requires de uma fase pedem, dito a quem quebra enquanto a ilha espera no fim da fase anterior.
    requires {
        missing = "<etag:'ONEBLOCK'> <body><value><phase><body> espera por:"
        money = " <dim>•</dim> <money><amount></money> <muted>do seu dinheiro"
        money_island = " <dim>•</dim> <money><amount></money> <muted>no banco da ilha"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>seus"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>no banco da ilha"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>nível de ilha <level><needed>"
        permission = " <dim>•</dim> <muted>o direito <value><permission>"
        met = "<tag:'ONEBLOCK'> <body>Tudo o que <value><phase><body> pede está aqui, e ela começa."
    }
    # Dito por oneblock-lucky-break de modules/effects.conf em uma quebra de sorte.
    lucky = "<tag:'ONEBLOCK'> <value>Uma quebra de sorte!<body> Algo bom veio junto."
    # O progresso de quem quebra, na barra de chefe ou na barra de ação, e onde ele aparece. Pode citar <phase>,
    # <broken> e <length>.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # A linha sobre o bloco, no idioma do servidor, enquanto progress.line está ligado.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'ONEBLOCK'> <body>Seu progresso do OneBlock agora aparece <value><bar><body>."
        names {
            bossbar = "em uma barra de chefe"
            actionbar = "na barra de ação"
            none = "em lugar nenhum"
        }
    }
    # Dito a quem quebra quando uma criatura hostil é sorteada com antecedência. Pode citar <creature> e <breaks>.
    creature_coming = "<etag:'ONEBLOCK'> <warn><creature><body> vem em <value><breaks><body> quebras."
    # Os caminhos de uma fase que se divide, ditos quando o arquivo dela está faltando, e a escolha.
    branch {
        offer = "<tag:'ONEBLOCK'> <value><phase><body> termina aqui. Sem escolha, <value><first><body> é tomada em <value><time><body>. Os caminhos:"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'ONEBLOCK'> <body>Sua ilha segue de <value><phase><body> para <value><way><body>."
        taken = "<tag:'ONEBLOCK'> <body>Nenhum caminho foi escolhido, então sua ilha segue de <value><phase><body> para <value><way><body>."
    }
    # A contagem regressiva sobre o bloco de uma fase que espera depois de começar. Pode citar <phase> e <time>.
    pause_line = "<value><phase>\n<body>começa em <value><time>"
    # Uma linha que as listas began, finished ou first-finished de um arquivo de fase citam com "@key".
    lists {
        plains_first = "<tag:'ONEBLOCK'> <body>Sua ilha deixou a <value>Planície<body> para trás pela primeira vez."
    }
    phases {
        plains = "Planície"
        underground = "Subterrâneo"
        snow = "Campos nevados"
        ocean = "Fundo do mar"
        jungle = "Selva"
        nether = "O Nether"
        end = "O End"
    }
    # O que cada fase incluída tem, como a prévia do arquivo dela cita, mostrado no menu de fases.
    previews {
        plains = "Grama, terra e madeira para construir, animais de fazenda e um baú do tesouro na quebra 100."
        underground = "Pedra e os primeiros minérios: carvão, ferro, cobre e ouro, com barris de tesouro."
        snow = "Neve, gelo e pinheiro, com lápis-lazúli no frio."
        ocean = "Areia, argila e prismarinho, lanternas do mar e esponjas, e um baú de naufrágio de vez em quando."
        jungle = "Madeira da selva, musgo, melancias e bambu, com esmeraldas escondidas."
        nether = "Netherrack, quartzo e ouro, pedra luminosa e, de vez em quando, detritos ancestrais."
        end = "Pedra do End, obsidiana e púrpura, com diamantes bem no final."
    }
}

