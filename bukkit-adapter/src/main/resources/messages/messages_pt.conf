parkour {
    # Dito quando um jogador entra em um percurso de Parkour e o que ele trouxe é guardado à parte.
    kept = "<tag:'PARKOUR'> <body>Seus itens ficam guardados em segurança enquanto você estiver neste percurso."
    # Dito quando um jogador sai de um percurso de Parkour e recebe de volta o que trouxe.
    given_back = "<tag:'PARKOUR'> <body>Seus itens estão de volta."
    # Dito quando uma corrida começa na placa de largada.
    started = "<tag:'PARKOUR'> <body>A corrida <good>começou<body>. Chegue à placa de chegada."
    # Dito em um ponto de controle.
    checkpoint = "<tag:'PARKOUR'> <body>Ponto de controle."
    # Dito em um ponto de controle que a corrida alcança pela primeira vez, quando o melhor tempo do corredor não chegou lá: quanto tempo a corrida levou.
    split = "<tag:'PARKOUR'> <body>Ponto de controle em <value><time><body>."
    # Dito em um ponto de controle tão rápido quanto o melhor do corredor ali, ou mais: <diff> é por quanto.
    split_ahead = "<tag:'PARKOUR'> <body>Ponto de controle em <value><time><body>, <good><diff><body> à frente do seu melhor tempo."
    # Dito em um ponto de controle mais lento que o melhor do corredor ali: <diff> é por quanto.
    split_behind = "<tag:'PARKOUR'> <body>Ponto de controle em <value><time><body>, <bad><diff><body> atrás do seu melhor tempo."
    # Dito quando um corredor que caiu volta ao último ponto de controle.
    returned = "<tag:'PARKOUR'> <body>De volta ao seu último ponto de controle."
    # Dito na chegada quando o banco de dados não pôde ser lido.
    finished = "<tag:'PARKOUR'> <body>Você terminou em <value><time><body>."
    # Dito na primeira chegada de um corredor no percurso.
    first = "<tag:'PARKOUR'> <body>Você terminou em <value><time><body>, sua primeira vez neste percurso."
    # Dito quando um corredor bate o melhor tempo dele.
    beaten = "<tag:'PARKOUR'> <body>Um novo melhor tempo de <good><time><body>, antes era <value><was><body>."
    # Dito quando um corredor é mais lento que o melhor tempo dele.
    slower = "<tag:'PARKOUR'> <body>Você terminou em <value><time><body>. Seu melhor tempo é <value><best><body>."
    # Dito quando uma chegada é mais rápida que qualquer um já correu o percurso, incluindo a primeira chegada.
    course_record = "<tag:'PARKOUR'> <good>Um recorde do percurso<body>: ninguém correu mais rápido que <value><time><body>."
    # Dito quando uma corrida passa do limite de tempo.
    timed_out = "<tag:'PARKOUR'> <body>A corrida demorou demais e <bad>acabou<body>."
    # Dito quando um corredor sai do percurso.
    left = "<tag:'PARKOUR'> <body>Você saiu do percurso, então a corrida <bad>acabou<body>."
    # Dito quando uma corrida termina por uma verificação que ela violou.
    check {
        flight = "<tag:'PARKOUR'> <body>Não se voa durante uma corrida. A corrida <bad>acabou<body>."
        teleport = "<tag:'PARKOUR'> <body>Você foi movido para fora do caminho do percurso. A corrida <bad>acabou<body>."
        speed = "<tag:'PARKOUR'> <body>Isso foi mais rápido do que qualquer um corre. A corrida <bad>acabou<body>."
    }
    # Dito quando uma corrida começa contra um fantasma: um item que só o corredor vê refaz uma corrida de <time>.
    ghost = "<tag:'PARKOUR'> <body>Um fantasma corre ao seu lado e termina em <value><time><body>. Vença ele."
    # Dito pelo comando course fora de um percurso de Parkour.
    not_course = "<etag:'ERRO'> <body>Você não está em um percurso de Parkour."
    # O cabeçalho do comando course.
    top_header = "<h:'Melhores tempos aqui'>"
    # Um corredor no comando course, o mais rápido primeiro.
