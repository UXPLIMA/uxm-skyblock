    left = "<tag:'PARKOUR'> <body>Du hast den Kurs verlassen, daher ist der Lauf <bad>vorbei<body>."
    # Gesagt, wenn ein Lauf wegen einer verletzten Prüfung endet.
    check {
        flight = "<tag:'PARKOUR'> <body>Kein Fliegen während eines Laufs. Der Lauf ist <bad>vorbei<body>."
        teleport = "<tag:'PARKOUR'> <body>Du wurdest vom Weg des Kurses bewegt. Der Lauf ist <bad>vorbei<body>."
        speed = "<tag:'PARKOUR'> <body>Das war schneller, als irgendwer läuft. Der Lauf ist <bad>vorbei<body>."
    }
    # Gesagt, wenn ein Lauf gegen einen Geist beginnt: Ein Gegenstand, den nur der Läufer sieht, wiederholt einen Lauf von <time>.
    ghost = "<tag:'PARKOUR'> <body>Ein Geist läuft neben dir und kommt in <value><time><body> ins Ziel. Schlag ihn."
    # Gesagt vom Befehl course außerhalb eines Parkour-Kurses.
    not_course = "<etag:'FEHLER'> <body>Du bist auf keinem Parkour-Kurs."
    # Die Überschrift des Befehls course.
    top_header = "<h:'Beste Zeiten hier'>"
    # Ein Läufer beim Befehl course, der schnellste zuerst.
    top_entry = " <muted>#<place></muted> <body><player></body> <value><time></value> <muted>(<runs> Läufe)"
