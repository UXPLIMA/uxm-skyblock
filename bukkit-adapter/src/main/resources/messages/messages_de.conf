    split_ahead = "<tag:'PARKOUR'> <body>Kontrollpunkt bei <value><time><body>, <good><diff><body> vor deiner Bestzeit."
    # Gesagt an einem Kontrollpunkt, langsamer als die Bestzeit des Läufers dort: <diff> ist um wie viel.
    split_behind = "<tag:'PARKOUR'> <body>Kontrollpunkt bei <value><time><body>, <bad><diff><body> hinter deiner Bestzeit."
