# Jede Menüdatei unter menus/ nennt ihre Titel, Gegenstandsnamen und Beschreibungen über
# diese Schlüssel, sodass ein Server, der eine zweite Sprache mitliefert, seine Menüs darin bekommt.
# Eine Zeile hier kann einen Live-Wert tragen, mit dem das Menü geöffnet wurde: Sie schreibt
# <argument_<name>>, dieselben Namen, die eine Menüdatei als %argument_<name>% schreibt.
# ==============================================================================
