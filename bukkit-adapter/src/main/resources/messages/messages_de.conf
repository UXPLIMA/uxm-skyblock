# Deutsche Nachrichten.
#
# Jede Zeile ist MiniMessage, und jede Zeile nennt eine Rolle statt einer Farbe: <body> ist der
# Text, <value> ein Name oder eine Zahl, <money> ein Geldbetrag, <good> und <bad> ein Zustand,
# und <tag:'INSEL'> ist das Kürzel, mit dem eine Chatzeile beginnt. Die Farben hinter diesen Namen
# stehen in theme.conf, daher steht in dieser Datei nie eine.
#
# Schreib hier ganz normale Wörter. Deutsch wird beim Anzeigen in Kapitälchen gesetzt, damit diese
# Datei für Übersetzer lesbar bleibt; ä, ö, ü und ß behalten ihre Form. <plain> lässt einen Befehl
# oder eine ID in normalen Buchstaben.
#
# Ein Schlüssel, den du löschst, fällt auf die Zeile im Plugin zurück, sodass ein Spieler nie eine
# leere Zeile liest. Kopier diese Datei nach messages_<tag>.conf und übersetz sie, um eine Sprache
# hinzuzufügen.

