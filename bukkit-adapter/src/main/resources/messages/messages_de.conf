        # Gesagt, wenn die Sterne außerhalb von 1 bis <most> liegen.
        range = "<etag:'FEHLER'> <body>Bewerte ihn von <value>1<body> bis <value><most><body>."
        # Gesagt, wenn der Operator Bewertungen ausgeschaltet hat.
