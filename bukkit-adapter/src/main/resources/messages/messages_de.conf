        failed = "<etag:'FEHLER'> <body>Die Bewertung konnte nicht gespeichert werden. Versuch es noch einmal."
    }
    # Die Schwierigkeiten aus modules/parkour.conf, nach Name. Ein Name, der hier nicht steht, wird so gezeigt, wie er geschrieben ist.
