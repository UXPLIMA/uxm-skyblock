# Der Spielmodus OneBlock. Jede Phase in modules/oneblock.conf wird hier nach ihrem Namen betitelt.
oneblock {
    # Gesagt zu dem Spieler, dessen Abbau eine neue Phase beginnt.
    phase_began = "<tag:'ONEBLOCK'> <body>Der Block wandelt sich, und <value><phase><body> beginnt."
    # Gesagt vom Befehl oneblock auf einer Insel, die keine OneBlock-Insel ist.
    not_oneblock = "<etag:'FEHLER'> <body>Deine Insel ist keine OneBlock-Insel."
    # Gesagt vom Befehl oneblock, wenn seine Menüdatei fehlt. Sie kann jeden Wert nennen, den das Menü nennt.
    standing = "<tag:'ONEBLOCK'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>: <value><phase_blocks><body> von <value><phase_length><body> Blöcken, <value><blocks_broken><body> insgesamt abgebaut."
    # Die Zeile eines OneBlock-Moments über dem Block, wie eine Phasendatei sie mit text = "@key" nennt.
    moments {
        plains_chest = "<value>Eine Truhe!<body> Öffne sie, bevor es jemand anderes tut."
    }
    # Was die requires-Zeilen einer Phase verlangen, dem Abbauenden gesagt, während die Insel am Ende der vorigen Phase wartet.
    requires {
        missing = "<etag:'ONEBLOCK'> <body><value><phase><body> wartet auf:"
        money = " <dim>•</dim> <money><amount></money> <muted>von deinem Geld"
        money_island = " <dim>•</dim> <money><amount></money> <muted>in der Inselbank"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>von dir selbst"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>in der Inselbank"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>Inselstufe <level><needed>"
        permission = " <dim>•</dim> <muted>das Recht <value><permission>"
        met = "<tag:'ONEBLOCK'> <body>Alles, was <value><phase><body> verlangt, ist da, und sie beginnt."
    }
    # Gesagt von oneblock-lucky-break in modules/effects.conf bei einem glücklichen Abbau.
    lucky = "<tag:'ONEBLOCK'> <value>Ein glücklicher Abbau!<body> Etwas Gutes kam mit."
    # Der Fortschritt eines Abbauenden, auf der Bossleiste oder der Aktionsleiste, und wo er angezeigt wird. Er kann <phase>,
    # <broken> und <length> nennen.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # Die Zeile über dem Block, in der Sprache des Servers, solange progress.line an ist.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'ONEBLOCK'> <body>Dein OneBlock-Fortschritt wird jetzt <value><bar><body> angezeigt."
        names {
            bossbar = "auf einer Bossleiste"
            actionbar = "auf der Aktionsleiste"
            none = "nirgends"
        }
    }
    # Gesagt zum Abbauenden, wenn eine feindliche Kreatur vorausgezogen wird. Es kann <creature> und <breaks> nennen.
    creature_coming = "<etag:'ONEBLOCK'> <warn><creature><body> kommt in <value><breaks><body> Abbauen."
    # Die Wege weiter aus einer Phase, die sich verzweigt, gesagt, wenn ihre Datei fehlt, und die Wahl.
    branch {
        offer = "<tag:'ONEBLOCK'> <value><phase><body> endet hier. Ohne Wahl wird in <value><time><body> <value><first><body> genommen. Die Wege weiter:"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'ONEBLOCK'> <body>Deine Insel geht von <value><phase><body> weiter nach <value><way><body>."
        taken = "<tag:'ONEBLOCK'> <body>Kein Weg wurde gewählt, daher geht deine Insel von <value><phase><body> weiter nach <value><way><body>."
    }
    # Der Countdown über dem Block einer Phase, die nach ihrem Beginn wartet. Er kann <phase> und <time> nennen.
    pause_line = "<value><phase>\n<body>beginnt in <value><time>"
    # Eine Zeile, die die Listen began, finished oder first-finished einer Phasendatei mit "@key" nennen.
    lists {
        plains_first = "<tag:'ONEBLOCK'> <body>Deine Insel hat die <value>Ebene<body> zum ersten Mal hinter sich gelassen."
    }
    phases {
        plains = "Ebene"
        underground = "Untergrund"
        snow = "Schneefelder"
        ocean = "Meeresgrund"
        jungle = "Dschungel"
        nether = "Der Nether"
        end = "Das End"
    }
    # Was jede mitgelieferte Phase enthält, wie die Vorschau ihrer Datei es nennt, gezeigt im Phasenmenü.
    previews {
        plains = "Gras, Erde und Holz zum Bauen, Nutztiere und eine Schatztruhe beim Abbau 100."
        underground = "Stein und die ersten Erze: Kohle, Eisen, Kupfer und Gold, mit Fässern voller Schätze."
        snow = "Schnee, Eis und Fichte, mit Lapislazuli in der Kälte."
        ocean = "Sand, Ton und Prismarin, Seelaternen und Schwämme, und hin und wieder eine Wracktruhe."
        jungle = "Tropenholz, Moos, Melonen und Bambus, mit Smaragden darin versteckt."
        nether = "Netherrack, Quarz und Gold, Leuchtstein und ab und zu antiker Schrott."
        end = "Endstein, Obsidian und Purpur, mit Diamanten ganz am Ende."
    }
}

loot {
    treasure_found = "<tag:'BEUTE'> <body>Ein legendärer Fund: <value>250<body> eingezahlt."
}

# Was /isadmin sagt. <target> ist der Name des Spielers oder die ID der Insel, die der Operator eingegeben hat.
isadmin {
    oneblock {
        not_oneblock = "<etag:'FEHLER'> <value><target><body> ist keine OneBlock-Insel."
        unknown_phase = "<etag:'FEHLER'> <body>Keine Phase heißt <value><phase><body>. Die Phasen sind <value><phases><body>."
        off_way = "<etag:'FEHLER'> <value><phase><body> liegt nicht auf dem Weg, den die Insel von <value><target><body> gewählt hat, daher kann sie dort nicht stehen."
        # Ein gesetzter oder erhöhter Zähler. <was> und <now> sind die Zähler, <phase> die Phase, in der sie jetzt steht.
        set = "<tag:'ONEBLOCK'> <value><target><body> hat <value><now><body> abgebaut <muted>(vorher <was>)<body> und steht in <value><phase><body>. Ihr Block wird neu gelegt."
        check = "<tag:'ONEBLOCK'> <value><target><body>: <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>, <value><phase_blocks><body> von <value><phase_length><body> Blöcken, <value><blocks_broken><body> insgesamt abgebaut. Der Block ist bei <value><at><body>."
        respawned = "<tag:'ONEBLOCK'> <body>Der Block von <value><target><body> ist als <value><block><body> neu gelegt."
    }
    top {
        in_game = "<etag:'FEHLER'> <body>Stell dich im Spiel dorthin, wo die Anzeige hin soll."
        unknown_board = "<etag:'FEHLER'> <body>Keine Rangliste heißt <value><asked><body>. Die Ranglisten sind <value><boards><body>."
        bad_rank = "<etag:'FEHLER'> <body>Ein Platz ist eine ganze Zahl von <value>1<body> bis <value><most><body>."
        bad_kind = "<etag:'FEHLER'> <body>Eine Anzeige ist <value>sign<body>, <value>head<body> oder <value>text<body>."
        no_block = "<etag:'FEHLER'> <body>Schau auf das Schild oder den Kopf, auf den die Anzeige kommt."
        # <kind> ist sign, head oder text, <board> die Rangliste, <position> der Platz, den sie zeigt, <at> wo.
        added = "<tag:'TOP'> <body>Die Anzeige <value><kind><body> bei <value><at><body> zeigt Platz <value><position><body> von <value><board><body>."
        removed = "<tag:'TOP'> <body>Die Anzeige bei <value><at><body> ist entfernt."
        none_here = "<etag:'FEHLER'> <body>Keine Anzeige ist dort, wo du hinschaust oder stehst."
        listed_none = "<tag:'TOP'> <body>Keine Anzeige ist platziert."
        listed = "<tag:'TOP'> <value><kind><body> bei <value><at><body>: Platz <value><position><body> von <value><board>"
    }
    chunkblock {
        not_chunkblock = "<etag:'FEHLER'> <value><target><body> ist keine ChunkBlock-Insel."
        # Der Konsole gesagt, die in keinem Chunk steht, wenn sie keinen nennt.
        name_the_chunk = "<etag:'FEHLER'> <body>Nenn den Chunk bei seinen Koordinaten: die Insel, dann Chunk x und Chunk z."
        # <chunk> sind die Koordinaten des Chunks, x dann z.
        opened = "<tag:'CHUNK'> <body>Chunk <value><chunk><body> von <value><target><body> ist offen und bleibt offen, was auch immer seine Stufe tut."
        refused {
            already_open = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> von <value><target><body> ist schon offen."
            not_beside_territory = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> liegt nicht neben den offenen Chunks von <value><target><body>."
            outside_island = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> liegt außerhalb der Insel von <value><target><body>."
            taken = "<etag:'FEHLER'> <body>Eine andere Änderung an <value><target><body> kam zuerst. Versuch es noch einmal."
            level_too_low = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> von <value><target><body> konnte nicht geöffnet werden."
        }
        closed = "<tag:'CHUNK'> <body>Chunk <value><chunk><body> von <value><target><body> ist geschlossen, und wer darin stand, wurde verschoben."
        not_open = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> von <value><target><body> ist keiner, der sich schließen kann: Er ist zu, oder er ist der erste der Insel."
        cuts_off = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> zu schließen würde andere offene Chunks von <value><target><body> abschneiden. Schließ diese zuerst."
        reset = "<tag:'CHUNK'> <body><value><count><body> Chunks von <value><target><body> sind geschlossen. Nur ihr erster ist offen."
    }
    tradewinds {
        not_vessel = "<etag:'FEHLER'> <value><target><body> ist kein TradeWinds-Schiff."
        unknown_rank = "<etag:'FEHLER'> <body>Kein Rang heißt <value><asked><body>. Die Ränge sind <value><ranks><body>."
        unknown_port = "<etag:'FEHLER'> <body>Kein Hafen heißt <value><port><body>. Die Häfen sind <value><ports><body>."
        # <vessel_rank> ist der Name des Rangs, <rows> wie viele Reihen sein Laderaum hat.
        ranked = "<tag:'SEE'> <value><target><body> ist jetzt eine <rank><vessel_rank><body>, ihr Laderaum hat <value><rows><body> Reihen."
        standing = "<tag:'SEE'> <body>Das Ansehen von <value><target><body> in <value><port><body> ist jetzt <value><standing><body>."
        moved = "<tag:'SEE'> <value><target><body> liegt jetzt in <value><port><body>."
        held_elsewhere = "<etag:'FEHLER'> <body>Ein anderer Server hält gerade <value><target><body>. Versuch es gleich noch einmal."
    }
    realms {
        not_realms = "<etag:'FEHLER'> <value><target><body> ist keine StrangerRealms-Insel."
        # <world> ist die Welt, die nicht geladen ist: das Land der Insel oder die Schattenwelt.
        not_loaded = "<etag:'FEHLER'> <body>Die Welt <value><world><body> ist nicht geladen, daher kann die Schattenwelt von <value><target><body> nicht gelegt werden."
        outside = "<etag:'FEHLER'> <body>Chunk <value><chunk><body> liegt außerhalb der Insel von <value><target><body>."
        remirrored = "<tag:'ADMIN'> <value><count><body> Chunks der Schattenwelt von <value><target><body> sind aus ihrem Land neu gelegt."
    }
    brix {
        # <theme> ist das Thema, wie es in modules/brix.conf oder im Befehl steht.
        opened = "<tag:'ADMIN'> <body>Ein Bauwettbewerb zum Thema <value><theme><body> ist eröffnet."
        under_way = "<etag:'FEHLER'> <body>Ein Bauwettbewerb läuft schon. Sag ihn zuerst ab."
        none = "<etag:'FEHLER'> <body>Kein Bauwettbewerb läuft."
        closed = "<tag:'ADMIN'> <body>Der Bauwettbewerb zum Thema <value><theme><body> ist abgesagt, mit seinen Anmeldungen und Stimmen."
        no_theme = "<etag:'FEHLER'> <body>Nenn ein Thema: <plain>modules/brix.conf</plain> listet keines."
    }
    parkour {
        not_course = "<etag:'FEHLER'> <value><target><body> ist kein Parkour-Kurs."
        unknown_runner = "<etag:'FEHLER'> <body>Kein Spieler namens <value><runner><body> war auf diesem Server."
        # <count> ist, wie viele Läufer ihre Rekorde verloren haben.
        reset = "<tag:'PARKOUR'> <body>Die Läufe auf <value><target><body> sind vergessen: <value><count><body> Läufer beginnen neu."
        reset_runner = "<tag:'PARKOUR'> <body>Die Läufe von <value><runner><body> auf <value><target><body> sind vergessen. Der nächste Zieleinlauf ist ein erster."
    }
    loot {
        in_game = "<etag:'FEHLER'> <body>Markier einen Behälter im Spiel, indem du ihn anschaust."
        unknown_table = "<etag:'FEHLER'> <body>Keine Beutetabelle heißt <value><table><body>. Die Tabellen sind <value><tables><body>."
        no_container = "<etag:'FEHLER'> <body>Schau auf eine Truhe, ein Fass oder einen anderen Behälter in der Nähe."
        # <at> ist, wo der Behälter steht, x, y und z.
        marked = "<tag:'ADMIN'> <body>Der Behälter bei <value><at><body> wird aus <value><table><body> gefüllt, wenn ein Spieler ihn zum ersten Mal öffnet."
    }
    boxed {
        not_boxed = "<etag:'FEHLER'> <value><target><body> ist keine Boxed-Insel."
        # <min> und <max> sind die kleinste und die größte Box, im Durchmesser.
        size_range = "<etag:'FEHLER'> <body>Eine Box ist <value><min><body> bis <value><max><body> breit, nicht <value><size><body>."
        changed = "<tag:'BOX'> <body>Die Box von <value><target><body> ist jetzt <value><size>×<size><body> <muted>(vorher <was>×<was>)<body>."
    }
}

