poseidon {
    # Gesagt vom Befehl lore zu einem Spieler, dessen Insel keine Poseidon-Insel ist.
    not_poseidon = "<etag:'FEHLER'> <body>Deine Insel ist keine Poseidon-Insel."
    # Gesagt vom Befehl lore, wenn die Sprachdatei keine Seiten enthält.
    lore_empty = "<tag:'SEE'> <body>Das Meer hat noch keine Geschichten zu erzählen."
    # Das Sagenbuch, das die Spieler einer Poseidon-Insel lesen. Jede Zeile von pages ist eine Seite: Schreib so viele,
    # wie du willst. Ein Java-Spieler liest ein Buch, ein Bedrock-Spieler ein Formular, eine Seite nach der anderen.
    lore {
        title = "Die Ertrunkene Chronik"
        author = "Das Meer"
        previous = "Vorherige Seite"
        next = "Nächste Seite"
        close = "Schließen"
        pages = [
            "<b>Die Ertrunkene Chronik</b>\n\nDu bist aus dem Meer geboren. Wasser ist deine Luft, und die trockene Welt darüber ist eine Wüste, die brennt.",
            "<b>Atme</b>\n\nIm Wasser atmest und siehst du. Außerhalb trocknet dich die Luft aus, und die Sonne brennt schlimmer. Regen hält dich eine Weile nass.",
            "<b>Bleib in Bewegung</b>\n\nDas Meer liebt das Stille nicht. Bleib zu lange an einer Stelle, und es zieht dir den Atem heraus. Schwimm, grab, bau, aber bleib in Bewegung.",
            "<b>Die Wracks</b>\n\nSchiffe liegen um dich herum auf dem Grund, und Ruinen, älter als sie. Ihre Truhen bergen, was die Ertrunkenen zurückließen.",
            "<b>Die gefluteten Tiefen</b>\n\nSelbst der Nether ist für deinesgleichen ertrunken. Wo andere Feuer finden, findest du wieder das Meer."
        ]
        # Die Kapitel der Geschichte, eins pro Geschichtsmission in modules/poseidon.conf, jedes gezeigt,
        # sobald der Leser seine Mission erfüllt hat. Jede Zeile ist eine Seite.
        chapters {
            poseidon_story_1 = [
                "<b>Salz und Stein</b>\n\nDie Scherben, die du abgegeben hast, waren kein Stein. Es waren Schuppen, abgeworfen von etwas, das unter dem Grund dieses Meeres schläft.",
                "Die alten Taucher nannten es den Tiefenhüter. Sie sagten, es habe die Tempel gebaut und an jede Tür Wächter gestellt."
            ]
            poseidon_story_2 = [
                "<b>Die Wächter</b>\n\nDie Wächter fielen, und ihre Augen wurden dunkel. Sie waren keine Bestien. Sie waren Schlösser, und du hast zehn davon geöffnet."
            ]
            poseidon_story_3 = [
                "<b>Laternen in der Tiefe</b>\n\nMit den brennenden Laternen zeigt sich der Weg nach unten: eine Treppe aus Prismarin, älter als die Wracks, die dorthin führt, wo nie Licht hinkam."
            ]
            poseidon_story_4 = [
                "<b>Alte Netze</b>\n\nIn den Netzen kam ein ertrunkenes Tagebuch herauf. Seine letzte Seite lautet: Der Älteste erwacht, wenn die Laternen brennen. Zünde sie nicht an."
            ]
            poseidon_story_5 = [
                "<b>Der Älteste</b>\n\nDer Älteste ist fort, und das Meer ist still. Die Tempel gehören jetzt dir, und die Tiefe auch. Die Geschichte endet, und deine beginnt."
            ]
        }
        # Die Seite des ersten noch nicht gefundenen Kapitels. <mission> ist die Geschichtsmission, die es findet.
        locked = "<b>Eine verlorene Seite</b>\n\nDas nächste Kapitel ist noch irgendwo im Meer.\n\nErfülle <mission>, um es zu finden."
    }
    # Der Tiefenboss einer Poseidon-Insel: sein Name, und was die Effektlisten in modules/effects.conf
    # sagen, wenn er aufsteigt, erschlagen wird oder zurücksinkt.
    boss {
        name = "<accent>Der Tiefe Älteste"
        rises = "<tag:'SEE'> <body>Etwas Altes steigt aus der Tiefe. <accent>Der Tiefe Älteste</accent> ist hier."
        rises_title = "<accent>Der Tiefe Älteste"
        rises_subtitle = "<body>steigt aus der Tiefe"
        slain = "<tag:'SEE'> <good>Der Tiefe Älteste ist erschlagen.<body> Das Meer ist wieder still."
        sinks = "<tag:'SEE'> <body>Der Tiefe Älteste sinkt zurück in die Dunkelheit."
    }
}

