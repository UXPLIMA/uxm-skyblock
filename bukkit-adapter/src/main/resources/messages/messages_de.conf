    slower = "<tag:'PARKOUR'> <body>Du bist in <value><time><body> ins Ziel gekommen. Deine Bestzeit ist <value><best><body>."
    # Gesagt, wenn ein Zieleinlauf schneller ist als jeder bisherige Lauf auf dem Kurs, den ersten eingeschlossen.
    course_record = "<tag:'PARKOUR'> <good>Ein Kursrekord<body>: Niemand ist ihn schneller gelaufen als <value><time><body>."
