        }
        # Se dice cuando se quita la etiqueta del recorrido.
        cleared {
            difficulty = "<tag:'PARKOUR'> <body>Este recorrido ya no tiene dificultad."
            category = "<tag:'PARKOUR'> <body>Este recorrido ya no tiene categoría."
        }
        # Se dice cuando el nombre no es ninguno de los que enumera el operador: <name>, y <choices>, los que sí.
        unknown = "<etag:'ERROR'> <body><value><name><body> no es uno de ellos. Elige entre <value><choices><body>."
        # Se dice a un jugador que no es del equipo del recorrido, o que no puede cambiar sus ajustes.
        not_team = "<etag:'ERROR'> <body>Solo el equipo del recorrido puede etiquetarlo."
        # Se dice cuando no se pudieron escribir las etiquetas.
        failed = "<etag:'ERROR'> <body>El recorrido no se pudo etiquetar. Inténtalo otra vez."
    }
    rate {
        # Se dice cuando se valora el recorrido: <stars> de <most>.
        done = "<tag:'PARKOUR'> <body>Has valorado este recorrido con <value><stars><body> de <value><most><body>."
        # Se dice a un corredor que no ha terminado el recorrido.
        not_finished = "<etag:'ERROR'> <body>Termina el recorrido antes de valorarlo."
        # Se dice al propio equipo del recorrido.
        own = "<etag:'ERROR'> <body>No puedes valorar tu propio recorrido."
        # Se dice cuando las estrellas están fuera de 1 a <most>.
        range = "<etag:'ERROR'> <body>Valóralo de <value>1<body> a <value><most><body>."
        # Se dice cuando el operador desactivó las valoraciones.
        off = "<etag:'ERROR'> <body>Los recorridos no se valoran en este servidor."
        # Se dice cuando no se pudo escribir la valoración.
        failed = "<etag:'ERROR'> <body>La valoración no se pudo guardar. Inténtalo otra vez."
    }
    # Las dificultades de modules/parkour.conf, por nombre. Un nombre que no esté aquí se muestra tal como está escrito.
    difficulties {
        easy = "Fácil"
        medium = "Media"
        hard = "Difícil"
        expert = "Experta"
    }
    # Las categorías de modules/parkour.conf, por nombre. Un nombre que no esté aquí se muestra tal como está escrito.
    categories {
        classic = "Clásico"
        speed = "Velocidad"
        maze = "Laberinto"
        dropper = "Dropper"
        puzzle = "Puzle"
    }
    courses {
        title = "Recorridos de Parkour"
        # La casilla de un recorrido. <entry_name> es el nombre de su isla, o unnamed de abajo.
        course {
            title = "<entry_name>"
            crumb = "Recorrido de Parkour"
            description = "En la isla de <entry_owner>."
            difficulty { label = "Dificultad", value = "<value><entry_difficulty>" }
            category { label = "Categoría", value = "<value><entry_category>" }
            rating { label = "Valorado", value = "<value><entry_rating> <muted>(<entry_ratings>)" }
            record { label = "Récord", value = "<value><entry_record>" }
            runs { label = "Carreras", value = "<value><entry_runs>" }
            visit = "<cta>Haz clic<subtext> para ir allí."
        }
        # El nombre de un recorrido cuya isla no tiene: <owner> es el dueño de la isla.
        unnamed = "Recorrido de <owner>"
        # Un recorrido que nadie ha valorado.
        unrated = "todavía no"
        # Un recorrido que nadie ha terminado.
        unfinished = "todavía no"
        # Se dice cuando el servidor no tiene ningún recorrido de Parkour.
        none = "<tag:'PARKOUR'> <body>Todavía no hay ningún recorrido de Parkour."
        # Se dice cuando no se pudieron leer los recorridos.
        failed = "<etag:'ERROR'> <body>No se pudieron leer los recorridos. Inténtalo otra vez."
        no_window = "<etag:'ERROR'> <body>Falta la ventana de los recorridos. Pide al servidor que restaure <plain>menus/parkour-courses.conf</plain>."
    }
    # Los tiempos de cada temporada que lleva el sistema de temporadas, cada una su propia clasificación.
    season {
        # <season> es el nombre de la temporada tal como lo escribe el sistema de temporadas.
        header = "<accent><season>: los mejores tiempos"
        empty = "<tag:'PARKOUR'> <body>Todavía nadie ha terminado este recorrido en <accent><season></accent>."
        none = "<tag:'PARKOUR'> <body>No hay ninguna temporada en curso."
        unknown = "<tag:'PARKOUR'> <body>No existe la temporada <accent><number></accent>."
        # Se dice cuando una llegada encabeza la temporada en curso: <time> es la carrera, <season> el nombre de la temporada.
        record = "<tag:'PARKOUR'> <good>Un récord de temporada<body>: <accent><time></accent> encabeza <accent><season></accent>."
    }
}
