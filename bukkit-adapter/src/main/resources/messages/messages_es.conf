block_values {
    title = "Valores de bloques"
    # La casilla de un bloque. <entry_name> es el bloque en el idioma del lector.
    block {
        title = "<entry_name>"
        crumb = "Valor del bloque"
        description = "Lo que uno de estos suma a una isla."
        worth { label = "Valor", value = "<money><entry_worth>" }
        points { label = "Puntos", value = "<value><entry_points>" }
        level { label = "Niveles", value = "<value><entry_level>" }
    }
    # Se dice cuando levels.conf no da valor a ningún bloque.
    none = "<tag:'VALOR'> <body>Ningún bloque vale nada en este servidor."
    disabled = "<etag:'ERROR'> <body>El valor de las islas está desactivado en este servidor."
    no_window = "<etag:'ERROR'> <body>Falta la ventana de los valores de bloques. Pide al servidor que restaure <plain>menus/block-values.conf</plain>."
}

# Las palabras con las que responden las clasificaciones de islas: un puesto que no tiene nadie, un valor que no está, y el
