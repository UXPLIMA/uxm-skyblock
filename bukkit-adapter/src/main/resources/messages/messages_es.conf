brix {
    # Se dice cuando un jugador entra en una parcela de Brix y lo que traía se aparta.
    entered = "<tag:'BRIX'> <body>Tus objetos están a salvo mientras estés en esta parcela."
    # Se dice cuando un jugador sale de una parcela de Brix y recupera lo que traía.
    left = "<tag:'BRIX'> <body>Ya tienes tus objetos de vuelta."
    # Se dice a un jugador que tiene que estar en una parcela de Brix para lo que pidió.
    not_plot = "<tag:'BRIX'> <bad>Ponte primero en una parcela de Brix."
    # Se dice a un jugador que no es del equipo de la parcela en la que está.
    not_team = "<tag:'BRIX'> <bad>Solo el equipo de esta parcela puede hacer eso."
    sky {
        # Se dice cuando el equipo de una parcela fija su hora. <written> es lo que escribió.
        time_set = "<tag:'BRIX'> <body>La hora en esta parcela es ahora <accent><written></accent>."
        # Se dice cuando el equipo de una parcela fija su clima. <written> es lo que escribió.
        weather_set = "<tag:'BRIX'> <body>El clima en esta parcela es ahora <accent><written></accent>."
        # Se dice para una hora que no existe. <written> es lo que se escribió.
        unknown_time = "<tag:'BRIX'> <bad><written> no es una hora. Escribe day, noon, sunset, night, midnight, sunrise, world o ticks de 0 a 23999."
        # Se dice para un clima que no existe. <written> es lo que se escribió.
        unknown_weather = "<tag:'BRIX'> <bad><written> no es un clima. Escribe clear, rain o world."
        # Se dice cuando el cielo de la parcela no se pudo guardar.
        failed = "<tag:'BRIX'> <bad>El cielo de la parcela no se pudo guardar. Inténtalo otra vez."
    }
    reset {
        # Se dice cuando el dueño de una parcela pide reiniciarla: todo lo construido se va y el suelo se vuelve a poner.
        confirm = "<tag:'BRIX'> <body>Todo lo construido en esta parcela se limpiará y su suelo se volverá a poner. Escribe <value><cmd:'plot reset confirm'><body> en 30 segundos para seguir."
        # Se dice para una confirmación sin que se haya pedido un reinicio de esta parcela en los últimos 30 segundos.
        not_asked = "<tag:'BRIX'> <bad>No se pidió ningún reinicio de esta parcela en los últimos 30 segundos. Escribe primero <value><cmd:'plot reset'><bad>."
        # Se dice cuando la parcela se está limpiando y su suelo se vuelve a poner.
        done = "<tag:'BRIX'> <good>La parcela se está limpiando y su suelo se vuelve a poner."
        # Se dice a un jugador que no es el dueño de la parcela.
        not_owner = "<tag:'BRIX'> <bad>Solo el dueño de esta parcela puede reiniciarla."
