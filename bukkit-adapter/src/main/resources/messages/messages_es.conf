# Mensajes en español.
#
# Cada línea es MiniMessage, y cada línea nombra un papel en lugar de un color: <body> es el
# texto, <value> un nombre o un número, <money> una cantidad de dinero, <good> y <bad> un estado,
# y <tag:'ISLA'> la etiqueta con la que empieza una línea del chat. Los colores detrás de esos
# nombres están en theme.conf, así que este archivo nunca lleva uno.
#
# Escribe aquí palabras normales. El español se muestra en versalitas, para que este archivo siga
# siendo legible para un traductor; á, é, í, ó, ú, ñ y ü conservan su forma. <plain> deja un
# comando o un id en letras normales.
#
# Una clave que borres vuelve a la línea que lleva el plugin, así que un jugador nunca lee una
# línea vacía. Copia este archivo a messages_<tag>.conf y tradúcelo para añadir un idioma.

