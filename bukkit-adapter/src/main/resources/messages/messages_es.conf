parkour {
    # Se dice cuando un jugador entra en un recorrido de Parkour y lo que traía se aparta.
    kept = "<tag:'PARKOUR'> <body>Tus objetos están a salvo mientras estés en este recorrido."
    # Se dice cuando un jugador sale de un recorrido de Parkour y recupera lo que traía.
    given_back = "<tag:'PARKOUR'> <body>Ya tienes tus objetos de vuelta."
    # Se dice cuando una carrera empieza en la placa de salida.
    started = "<tag:'PARKOUR'> <body>La carrera ha <good>empezado<body>. Llega a la placa de meta."
    # Se dice en un punto de control.
    checkpoint = "<tag:'PARKOUR'> <body>Punto de control."
    # Se dice en un punto de control que la carrera alcanza por primera vez, cuando el mejor tiempo del corredor no llegó: cuánto tardó la carrera.
    split = "<tag:'PARKOUR'> <body>Punto de control en <value><time><body>."
    # Se dice en un punto de control tan rápido como el mejor del corredor allí, o más: <diff> es por cuánto.
    split_ahead = "<tag:'PARKOUR'> <body>Punto de control en <value><time><body>, <good><diff><body> por delante de tu mejor tiempo."
    # Se dice en un punto de control más lento que el mejor del corredor allí: <diff> es por cuánto.
    split_behind = "<tag:'PARKOUR'> <body>Punto de control en <value><time><body>, <bad><diff><body> por detrás de tu mejor tiempo."
    # Se dice cuando un corredor que cayó vuelve al último punto de control.
    returned = "<tag:'PARKOUR'> <body>De vuelta a tu último punto de control."
    # Se dice en la meta cuando no se pudo leer la base de datos.
    finished = "<tag:'PARKOUR'> <body>Has terminado en <value><time><body>."
    # Se dice la primera vez que un corredor termina el recorrido.
    first = "<tag:'PARKOUR'> <body>Has terminado en <value><time><body>, tu primera vez en este recorrido."
    # Se dice cuando un corredor bate su mejor tiempo.
    beaten = "<tag:'PARKOUR'> <body>Un nuevo mejor tiempo de <good><time><body>, antes <value><was><body>."
    # Se dice cuando un corredor es más lento que su mejor tiempo.
    slower = "<tag:'PARKOUR'> <body>Has terminado en <value><time><body>. Tu mejor tiempo es <value><best><body>."
    # Se dice cuando una llegada es más rápida que nadie ha corrido el recorrido, incluida la primera.
    course_record = "<tag:'PARKOUR'> <good>Un récord del recorrido<body>: nadie lo ha corrido más rápido que <value><time><body>."
    # Se dice cuando una carrera dura más que el límite.
    timed_out = "<tag:'PARKOUR'> <body>La carrera tardó demasiado y ha <bad>terminado<body>."
    # Se dice cuando un corredor sale del recorrido.
    left = "<tag:'PARKOUR'> <body>Saliste del recorrido, así que la carrera ha <bad>terminado<body>."
    # Se dice cuando una carrera termina por una comprobación que falló.
    check {
        flight = "<tag:'PARKOUR'> <body>No se vuela durante una carrera. La carrera ha <bad>terminado<body>."
        teleport = "<tag:'PARKOUR'> <body>Se te movió fuera del camino del recorrido. La carrera ha <bad>terminado<body>."
        speed = "<tag:'PARKOUR'> <body>Eso fue más rápido de lo que nadie corre. La carrera ha <bad>terminado<body>."
    }
    # Se dice cuando una carrera empieza contra un fantasma: un objeto que solo ve el corredor repite una carrera de <time>.
    ghost = "<tag:'PARKOUR'> <body>Un fantasma corre a tu lado y termina en <value><time><body>. Gánale."
    # Lo dice el comando course fuera de un recorrido de Parkour.
    not_course = "<etag:'ERROR'> <body>No estás en un recorrido de Parkour."
    # El encabezado del comando course.
    top_header = "<h:'Mejores tiempos aquí'>"
    # Un corredor en el comando course, el más rápido primero.
    top_entry = " <muted>#<place></muted> <body><player></body> <value><time></value> <muted>(<runs> carreras)"
    # Lo dice el comando course cuando nadie ha terminado el recorrido.
    top_empty = "<tag:'PARKOUR'> <body>Todavía nadie ha terminado este recorrido."
    # La línea de etiquetas del panel del recorrido: <difficulty> y <category>, cada una una palabra de abajo o el nombre tal como está escrito.
    about_tags = "<muted>Dificultad</muted> <value><difficulty></value> <muted>Categoría</muted> <value><category></value>"
    # La valoración del panel del recorrido: <rating> estrellas de <most> de media, de <count> corredores.
    about_rating = "<muted>Valorado</muted> <value><rating></value><muted>/<most> por <count> corredores</muted>"
    # El panel del recorrido cuando ningún corredor lo ha valorado.
    about_unrated = "<muted>Todavía sin valorar.</muted>"
