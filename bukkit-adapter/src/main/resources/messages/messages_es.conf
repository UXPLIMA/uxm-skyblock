        not_realms = "<etag:'ERROR'> <value><target><body> no es una isla StrangerRealms."
        # <world> es el mundo que no está cargado: la tierra de la isla, o el Mundo del Revés.
        not_loaded = "<etag:'ERROR'> <body>El mundo <value><world><body> no está cargado, así que no se puede poner el Mundo del Revés de <value><target><body>."
        outside = "<etag:'ERROR'> <body>El chunk <value><chunk><body> está fuera de la isla de <value><target><body>."
        remirrored = "<tag:'ADMIN'> <value><count><body> chunks del Mundo del Revés de <value><target><body> se vuelven a poner desde su tierra."
    }
    brix {
        # <theme> es el tema tal como está escrito en modules/brix.conf o en el comando.
        opened = "<tag:'ADMIN'> <body>Un concurso de construcción sobre <value><theme><body> está abierto."
        under_way = "<etag:'ERROR'> <body>Ya hay un concurso de construcción en curso. Cancélalo primero."
        none = "<etag:'ERROR'> <body>No hay ningún concurso de construcción en curso."
        closed = "<tag:'ADMIN'> <body>El concurso de construcción sobre <value><theme><body> se ha cancelado, con sus inscripciones y votos."
        no_theme = "<etag:'ERROR'> <body>Nombra un tema: <plain>modules/brix.conf</plain> no enumera ninguno."
    }
    parkour {
        not_course = "<etag:'ERROR'> <value><target><body> no es un recorrido de Parkour."
        unknown_runner = "<etag:'ERROR'> <body>Ningún jugador llamado <value><runner><body> ha estado en este servidor."
        # <count> es cuántos corredores perdieron sus registros.
        reset = "<tag:'PARKOUR'> <body>Las carreras en <value><target><body> se han olvidado: <value><count><body> corredores empiezan de nuevo."
        reset_runner = "<tag:'PARKOUR'> <body>Las carreras de <value><runner><body> en <value><target><body> se han olvidado. Su próxima llegada es una primera."
    }
    loot {
        in_game = "<etag:'ERROR'> <body>Marca un contenedor en el juego, mirándolo."
        unknown_table = "<etag:'ERROR'> <body>Ninguna tabla de botín se llama <value><table><body>. Las tablas son <value><tables><body>."
        no_container = "<etag:'ERROR'> <body>Mira un cofre, un barril u otro contenedor cercano."
        # <at> es dónde está el contenedor, x, y y z.
        marked = "<tag:'ADMIN'> <body>El contenedor en <value><at><body> se llena desde <value><table><body> la primera vez que un jugador lo abre."
    }
    boxed {
        not_boxed = "<etag:'ERROR'> <value><target><body> no es una isla Boxed."
        # <min> y <max> son la caja más pequeña y la más grande, de lado a lado.
        size_range = "<etag:'ERROR'> <body>Una caja mide de <value><min><body> a <value><max><body> de lado, no <value><size><body>."
        changed = "<tag:'CAJA'> <body>La caja de <value><target><body> es ahora de <value><size>×<size><body> <muted>(antes <was>×<was>)<body>."
    }
}

stacking {
    line = "<value>×<size>"
}

# Una pantalla de clasificación. <position> es el puesto, <board> la clasificación, <island> el nombre de la isla, <owner> su
# dueño, <score> su puntuación. Un puesto que todavía no tiene nadie dice empty.
top_display {
    sign {
        line1 = "<tag:'#<position>'>"
        line2 = "<value><island>"
        line3 = "<body><owner>"
        line4 = "<money><score>"
    }
    sign_empty {
        line1 = "<tag:'#<position>'>"
        line2 = "<muted>Nadie todavía"
        line3 = ""
        line4 = ""
    }
    text = "<tag:'#<position>'> <body><board><newline><value><island><newline><body><owner> <muted>· <money><score>"
    text_empty = "<tag:'#<position>'> <body><board><newline><muted>Nadie todavía"
}

visitors {
    command_blocked = "<etag:'ERROR'> <body>Los visitantes no pueden usar <value>/<command><body> en esta isla."
}

visit_fee {
    asks = "<tag:'VISITA'> <body>Esta isla cobra <money><amount><body> por visitarla. Escribe <value><command><body> para pagar e ir."
    paid = "<tag:'VISITA'> <body>Has pagado <money><amount><body> al banco de la isla."
    unaffordable = "<etag:'ERROR'> <body>No puedes pagar los <money><amount><body> que cobra esta isla por visitarla."
