# ==============================================================================
# Palabras de los menús.
#
# Cada archivo de menú en menus/ nombra sus títulos, nombres de objetos y descripciones con
# estas claves, así que un servidor que trae un segundo idioma tiene sus menús en él.
# Una línea de aquí puede llevar un valor vivo con el que se abrió el menú: se escribe
# <argument_<name>>, los mismos nombres que un archivo de menú escribe como %argument_<name>%.
# ==============================================================================
menu {
    # Las dos palabras que cada casilla escribe sobre su descripción y sus datos, iguales en cada ventana.
    lore {
        description = "Descripción"
        details = "Detalles"
    }

    oneblock {
        title = "OneBlock"
        note = "<tag:'ONEBLOCK'> <body>Rompe el bloque para avanzar por las fases."
        phase {
            title = "<argument_phase>"
            crumb = "OneBlock"
            description = "La fase en la que está ahora el bloque. Cada una trae sus propios bloques y criaturas."
            number { label = "Fase", value = "<value><argument_phase_number>/<argument_phase_count>" }
            action = "<cta>Haz clic<subtext> para ver cada fase"
        }
        progress {
            title = "Esta fase"
            crumb = "OneBlock"
            description = "Cuánto ha avanzado tu isla en la fase."
            percent { label = "Avance", value = "<level><argument_phase_percent>%" }
            broken { label = "Rotos", value = "<value><argument_phase_blocks>/<argument_phase_length>" }
            left { label = "Faltan", value = "<value><argument_phase_left>" }
            next { label = "Después", value = "<value><argument_next_phase>" }
        }
        bar {
            title = "Tu progreso"
            crumb = "OneBlock"
            description = "Dónde se muestra el progreso de tu isla mientras rompes su bloque."
            where { label = "Se muestra", value = "<value><argument_bar>" }
            action = "<cta>Haz clic<subtext> para mostrarlo en otro sitio"
        }
        broken {
            title = "Cada rotura"
            crumb = "OneBlock"
            description = "Cada bloque que tu isla ha roto desde que empezó, y quién los rompió."
            total { label = "Rotos", value = "<value><argument_blocks_broken>" }
            mine { label = "Por ti", value = "<value><argument_my_breaks>" }
            top { label = "El que más", value = "<value><argument_top_member> <muted><argument_top_member_breaks>" }
