    }
    contest {
        # <days>, <hours> y <minutes> son el tiempo que queda; <entered> cuántas parcelas hay inscritas.
        building = "<tag:'BRIX'> <body>Hay un concurso de construcción sobre <accent><theme><body> en curso. Parcelas inscritas: <value><entered><body>. La construcción termina en <value><days>d <hours>h <minutes>min<body>. Ponte en tu parcela y escribe <value><cmd:'contest join'><body> para inscribirla."
        voting = "<tag:'BRIX'> <body>El concurso sobre <accent><theme><body> acepta votos durante <value><days>d <hours>h <minutes>min<body> más. Parcelas inscritas: <value><entered><body>. Ponte en una que no sea tuya y dale de 1 a <value><most><body> estrellas con <value><cmd:'contest vote'><body>."
        none = "<tag:'BRIX'> <body>No hay ningún concurso de construcción en curso."
        # <owner> es el dueño de la parcela que quedó primera.
        last = "<tag:'BRIX'> <body>No hay ningún concurso de construcción en curso. El último, sobre <accent><theme><body>, lo ganó la parcela de <value><owner><body>."
