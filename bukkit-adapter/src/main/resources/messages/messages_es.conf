        opened = "<tag:'BRIX'> <good>¡Ha empezado un concurso de construcción! <body>El tema es <accent><theme><body>. Inscribe tu parcela con <value><cmd:'contest join'><body> en <value><days>d <hours>h <minutes>min<body>."
        # Se dice a todos cuando termina la construcción y empiezan los votos.
        votes_open = "<tag:'BRIX'> <body>La construcción sobre <accent><theme><body> ha terminado. Visita las parcelas inscritas, <value><entered><body> en total, y da a cada una de 1 a <value><most><body> estrellas con <value><cmd:'contest vote'><body>, durante <value><days>d <hours>h <minutes>min<body>."
        # Se dice a todos cuando terminan los votos; sigue una línea por cada puesto premiado.
        ended = "<tag:'BRIX'> <body>El concurso de construcción sobre <accent><theme><body> ha terminado. Los puestos:"
        # <average> son las estrellas de media y <votes> cuántos votaron.
        place = "<body>  <accent>#<place></accent> la parcela de <value><owner></value>: <value><average></value> estrellas, votos: <value><votes></value>"
        ended_empty = "<tag:'BRIX'> <body>El concurso de construcción sobre <accent><theme><body> ha terminado, y no se inscribió ninguna parcela."
        # <min> es el mínimo de votos que necesita una parcela para tener puesto.
        ended_unplaced = "<tag:'BRIX'> <body>El concurso de construcción sobre <accent><theme><body> ha terminado. Ninguna parcela consiguió los <value><min><body> votos que hacen falta para tener puesto."
        # Se dice a todos cuando un operador cancela el concurso.
        closed = "<tag:'BRIX'> <body>El concurso de construcción sobre <accent><theme><body> se ha cancelado."
        joined = "<tag:'BRIX'> <good>Tu parcela está inscrita en el concurso sobre <theme>. Construye sobre el tema antes de que acabe la construcción."
        already = "<tag:'BRIX'> <bad>Esta parcela ya está inscrita."
        not_building = "<tag:'BRIX'> <bad>Las parcelas solo se inscriben mientras el concurso está en construcción."
        not_voting = "<tag:'BRIX'> <bad>Los votos solo se aceptan cuando termina la construcción, hasta que terminan los votos."
        not_entered = "<tag:'BRIX'> <bad>Esta parcela no está inscrita en el concurso."
        own_plot = "<tag:'BRIX'> <bad>No puedes votar por una parcela de tu propio equipo."
        bad_stars = "<tag:'BRIX'> <bad>Da de 1 a <most> estrellas."
        voted = "<tag:'BRIX'> <good>Has dado <stars> estrellas a esta parcela. <body>Puedes cambiarlas hasta que terminen los votos."
        failed = "<tag:'BRIX'> <bad>No se pudo llegar al concurso. Inténtalo otra vez."
        # Los temas de modules/brix.conf, por nombre. Un tema que no esté aquí se muestra tal como está escrito.
        themes {
            lighthouse = "Un faro"
            castle = "Un castillo"
            treehouse = "Una casa en el árbol"
            village = "Una aldea"
            ship = "Un barco"
            garden = "Un jardín"
        }
    }
}

