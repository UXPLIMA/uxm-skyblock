poseidon {
    # Lo dice el comando lore a un jugador cuya isla no es una isla Poseidon.
    not_poseidon = "<etag:'ERROR'> <body>Tu isla no es una isla Poseidon."
    # Lo dice el comando lore cuando el archivo de idioma no tiene páginas.
    lore_empty = "<tag:'MAR'> <body>El mar todavía no tiene historias que contar."
    # El libro de leyendas que leen los jugadores de una isla Poseidon. Cada línea de pages es una página: escribe
    # tantas como quieras. Un jugador de Java lee un libro, uno de Bedrock un formulario, página a página.
    lore {
        title = "La Crónica Ahogada"
        author = "El Mar"
        previous = "Página anterior"
        next = "Página siguiente"
        close = "Cerrar"
        pages = [
            "<b>La Crónica Ahogada</b>\n\nNaciste del mar. El agua es tu aire, y el mundo seco de arriba es un desierto que quema.",
            "<b>Respira</b>\n\nEn el agua respiras y ves. Fuera de ella el aire te seca, y el sol quema peor. La lluvia te mantiene mojado un rato.",
            "<b>No te quedes quieto</b>\n\nEl mar no ama lo quieto. Quédate demasiado en un sitio y te saca el aliento. Nada, cava, construye, pero sigue moviéndote.",
            "<b>Los naufragios</b>\n\nHay barcos en el fondo a tu alrededor, y ruinas más viejas que ellos. Sus cofres guardan lo que dejaron los ahogados.",
            "<b>Las profundidades inundadas</b>\n\nHasta el Nether está ahogado para los tuyos. Donde otros encuentran fuego, tú volverás a encontrar el mar."
        ]
        # Los capítulos de la historia, uno por cada misión de historia nombrada en modules/poseidon.conf, cada uno visible
        # cuando el lector ha cumplido su misión. Cada línea es una página.
        chapters {
            poseidon_story_1 = [
                "<b>Sal y piedra</b>\n\nLos fragmentos que entregaste no eran piedra. Eran escamas, mudadas por algo que duerme bajo el fondo de este mar.",
                "Los viejos buzos lo llamaban el Guardián de lo Hondo. Decían que construyó los templos y que puso vigilantes en cada puerta."
            ]
            poseidon_story_2 = [
                "<b>Los vigilantes</b>\n\nLos guardianes cayeron y sus ojos se apagaron. No eran bestias. Eran cerraduras, y has abierto diez."
            ]
            poseidon_story_3 = [
                "<b>Faroles abajo</b>\n\nCon los faroles encendidos, el camino hacia abajo se muestra: una escalera de prismarina, más vieja que los naufragios, que va adonde nunca llegó la luz."
            ]
            poseidon_story_4 = [
                "<b>Redes viejas</b>\n\nEn las redes subió un diario ahogado. Su última página dice: el Anciano despierta cuando arden los faroles. No los enciendas."
            ]
            poseidon_story_5 = [
                "<b>El anciano</b>\n\nEl Anciano se ha ido, y el mar está en calma. Los templos son tuyos ahora, y lo hondo también. La historia termina, y empieza la tuya."
            ]
        }
        # La página del primer capítulo que aún no se ha encontrado. <mission> es la misión de historia que lo encuentra.
        locked = "<b>Una página perdida</b>\n\nEl siguiente capítulo todavía está en algún lugar del mar.\n\nCumple <mission> para encontrarlo."
    }
    # El jefe de las profundidades de una isla Poseidon: su nombre, y lo que dicen las listas de efectos de modules/effects.conf
    # cuando surge, cae o vuelve a hundirse.
    boss {
        name = "<accent>El Anciano de lo Hondo"
        rises = "<tag:'MAR'> <body>Algo antiguo surge de lo hondo. <accent>El Anciano de lo Hondo</accent> está aquí."
        rises_title = "<accent>El Anciano de lo Hondo"
        rises_subtitle = "<body>surge de lo hondo"
        slain = "<tag:'MAR'> <good>El Anciano de lo Hondo ha caído.<body> El mar vuelve a estar en calma."
        sinks = "<tag:'MAR'> <body>El Anciano de lo Hondo se hunde de nuevo en la oscuridad."
    }
}

