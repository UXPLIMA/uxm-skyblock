# El modo de juego OneBlock. Cada fase de modules/oneblock.conf se titula aquí por su nombre.
oneblock {
    # Se dice al jugador cuya rotura empieza una fase nueva.
    phase_began = "<tag:'ONEBLOCK'> <body>El bloque cambia, y empieza <value><phase><body>."
    # Lo dice el comando oneblock en una isla que no es una isla OneBlock.
    not_oneblock = "<etag:'ERROR'> <body>Tu isla no es una isla OneBlock."
    # Lo dice el comando oneblock cuando falta su archivo de menú. Puede nombrar cada valor que nombra el menú.
    standing = "<tag:'ONEBLOCK'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>: <value><phase_blocks><body> de <value><phase_length><body> bloques, <value><blocks_broken><body> rotos en total."
    # La línea de un momento de OneBlock sobre el bloque, tal como la nombra un archivo de fase con text = "@key".
    moments {
        plains_chest = "<value>¡Un cofre!<body> Ábrelo antes que nadie."
    }
    # Lo que piden las líneas requires de una fase, dicho al que rompe mientras la isla espera al final de la fase anterior.
    requires {
        missing = "<etag:'ONEBLOCK'> <body><value><phase><body> espera:"
        money = " <dim>•</dim> <money><amount></money> <muted>de tu dinero"
        money_island = " <dim>•</dim> <money><amount></money> <muted>en el banco de la isla"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>tuyos"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>en el banco de la isla"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>nivel de isla <level><needed>"
        permission = " <dim>•</dim> <muted>el derecho <value><permission>"
        met = "<tag:'ONEBLOCK'> <body>Todo lo que pide <value><phase><body> está, y empieza."
    }
    # Lo dice oneblock-lucky-break de modules/effects.conf en una rotura con suerte.
    lucky = "<tag:'ONEBLOCK'> <value>¡Una rotura con suerte!<body> Algo bueno vino con ella."
    # El progreso del que rompe, en la barra de jefe o en la barra de acción, y dónde se muestra. Puede nombrar <phase>,
    # <broken> y <length>.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # La línea sobre el bloque, en el idioma del servidor, mientras progress.line está activo.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'ONEBLOCK'> <body>Tu progreso de OneBlock se muestra ahora <value><bar><body>."
        names {
            bossbar = "en una barra de jefe"
            actionbar = "en la barra de acción"
            none = "en ningún sitio"
        }
    }
    # Se dice al que rompe cuando se adelanta una criatura hostil. Puede nombrar <creature> y <breaks>.
    creature_coming = "<etag:'ONEBLOCK'> <warn><creature><body> llega en <value><breaks><body> roturas."
    # Los caminos desde una fase que se bifurca, dichos cuando falta su archivo, y la elección.
    branch {
        offer = "<tag:'ONEBLOCK'> <value><phase><body> termina aquí. Si no eliges, se toma <value><first><body> en <value><time><body>. Los caminos:"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'ONEBLOCK'> <body>Tu isla sigue de <value><phase><body> a <value><way><body>."
        taken = "<tag:'ONEBLOCK'> <body>No se eligió camino, así que tu isla sigue de <value><phase><body> a <value><way><body>."
    }
    # La cuenta atrás sobre el bloque de una fase que espera al empezar. Puede nombrar <phase> y <time>.
    pause_line = "<value><phase>\n<body>empieza en <value><time>"
    # Una línea que nombran con "@key" las listas began, finished o first-finished de un archivo de fase.
    lists {
        plains_first = "<tag:'ONEBLOCK'> <body>Tu isla ha dejado atrás la <value>Llanura<body> por primera vez."
    }
    phases {
        plains = "Llanura"
        underground = "Subsuelo"
        snow = "Campos nevados"
        ocean = "Fondo marino"
        jungle = "Jungla"
        nether = "El Nether"
        end = "El End"
    }
    # Lo que contiene cada fase incluida, tal como la nombra la vista previa de su archivo, mostrado en el menú de fases.
    previews {
        plains = "Hierba, tierra y madera para construir, animales de granja y un cofre del tesoro en la rotura 100."
        underground = "Piedra y los primeros minerales: carbón, hierro, cobre y oro, con barriles de tesoro."
        snow = "Nieve, hielo y abeto, con lapislázuli en el frío."
        ocean = "Arena, arcilla y prismarina, faroles marinos y esponjas, y algún cofre de naufragio."
        jungle = "Madera de jungla, musgo, sandías y bambú, con esmeraldas escondidas."
        nether = "Netherrack, cuarzo y oro, piedra luminosa y de vez en cuando escombros ancestrales."
        end = "Piedra del End, obsidiana y púrpur, con diamantes al final del todo."
    }
}

