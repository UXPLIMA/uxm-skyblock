parkour {
    # Говорится, когда игрок ступает на трассу Parkour и то, что он принёс, откладывается.
    kept = "<tag:'PARKOUR'> <body>Твои предметы хранятся в безопасности, пока ты на этой трассе."
    # Говорится, когда игрок покидает трассу Parkour и получает обратно то, что принёс.
    given_back = "<tag:'PARKOUR'> <body>Твои предметы снова у тебя."
    # Говорится, когда забег начинается на стартовой плите.
    started = "<tag:'PARKOUR'> <body>Забег <good>начался<body>. Доберись до финишной плиты."
    # Говорится на контрольной точке.
    checkpoint = "<tag:'PARKOUR'> <body>Контрольная точка."
    # Говорится на контрольной точке, которую забег достиг впервые, а лучший забег бегуна нет: сколько длился забег.
    split = "<tag:'PARKOUR'> <body>Контрольная точка на <value><time><body>."
    # Говорится на контрольной точке так же быстро, как лучший результат бегуна там, или быстрее: <diff> на сколько.
    split_ahead = "<tag:'PARKOUR'> <body>Контрольная точка на <value><time><body>, на <good><diff><body> быстрее твоего лучшего."
    # Говорится на контрольной точке медленнее лучшего результата бегуна там: <diff> на сколько.
    split_behind = "<tag:'PARKOUR'> <body>Контрольная точка на <value><time><body>, на <bad><diff><body> медленнее твоего лучшего."
    # Говорится, когда упавшего бегуна возвращают на последнюю контрольную точку.
    returned = "<tag:'PARKOUR'> <body>Назад к твоей последней контрольной точке."
    # Говорится на финише, когда базу данных не удалось прочитать.
    finished = "<tag:'PARKOUR'> <body>Ты финишировал за <value><time><body>."
    # Говорится на первом финише бегуна на трассе.
    first = "<tag:'PARKOUR'> <body>Ты финишировал за <value><time><body>, впервые на этой трассе."
    # Говорится, когда бегун бьёт свой лучший результат.
    beaten = "<tag:'PARKOUR'> <body>Новый лучший результат <good><time><body>, было <value><was><body>."
    # Говорится, когда бегун медленнее своего лучшего результата.
    slower = "<tag:'PARKOUR'> <body>Ты финишировал за <value><time><body>. Твой лучший результат <value><best><body>."
    # Говорится, когда финиш быстрее, чем кто-либо проходил трассу, включая первый финиш на ней.
    course_record = "<tag:'PARKOUR'> <good>Рекорд трассы<body>: никто не проходил её быстрее, чем за <value><time><body>."
    # Говорится, когда забег длится дольше предела.
    timed_out = "<tag:'PARKOUR'> <body>Забег длился слишком долго и <bad>окончен<body>."
    # Говорится, когда бегун покидает трассу.
    left = "<tag:'PARKOUR'> <body>Ты покинул трассу, поэтому забег <bad>окончен<body>."
    # Говорится, когда забег заканчивается из-за нарушенной проверки.
    check {
        flight = "<tag:'PARKOUR'> <body>В забеге летать нельзя. Забег <bad>окончен<body>."
        teleport = "<tag:'PARKOUR'> <body>Тебя сдвинули с пути трассы. Забег <bad>окончен<body>."
        speed = "<tag:'PARKOUR'> <body>Это было быстрее, чем кто-либо бегает. Забег <bad>окончен<body>."
    }
    # Говорится, когда забег начинается против призрака: предмет, видимый только бегуну, повторяет забег за <time>.
    ghost = "<tag:'PARKOUR'> <body>Рядом с тобой бежит призрак, он финиширует за <value><time><body>. Обгони его."
    # Говорится командой course вне трассы Parkour.
    not_course = "<etag:'ОШИБКА'> <body>Ты не на трассе Parkour."
    # Заголовок команды course.
    top_header = "<h:'Лучшее время здесь'>"
    # Один бегун в команде course, самые быстрые первыми.
    top_entry = " <muted>#<place></muted> <body><player></body> <value><time></value> <muted>(забегов: <runs>)"
    # Говорится командой course, когда никто ещё не прошёл трассу.
    top_empty = "<tag:'PARKOUR'> <body>Эту трассу ещё никто не прошёл."
    # Строка меток на табличке трассы: <difficulty> и <category>, каждая это слово ниже или название как написано.
    about_tags = "<muted>Сложность</muted> <value><difficulty></value> <muted>Категория</muted> <value><category></value>"
    # Оценка на табличке трассы: в среднем <rating> звёзд из <most>, от <count> бегунов.
    about_rating = "<muted>Оценка</muted> <value><rating></value><muted>/<most>, бегунов: <count></muted>"
    # Табличка трассы, когда ни один бегун её не оценил.
    about_unrated = "<muted>Пока без оценки.</muted>"
    tag {
        # Говорится для метки, которой у трассы нет.
        none = "нет"
        # Говорится, когда задана метка трассы: <tag>.
        set {
            difficulty = "<tag:'PARKOUR'> <body>Сложность этой трассы теперь <value><tag><body>."
