# Режим игры OneBlock. Каждая фаза из modules/oneblock.conf озаглавлена здесь по своему названию.
oneblock {
    # Говорится игроку, чей удар начинает новую фазу.
    phase_began = "<tag:'ONEBLOCK'> <body>Блок меняется, и начинается <value><phase><body>."
    # Говорится командой oneblock на острове, который не остров OneBlock.
    not_oneblock = "<etag:'ОШИБКА'> <body>Твой остров не остров OneBlock."
    # Говорится командой oneblock, когда файла её меню нет. Может называть любое значение, которое называет меню.
    standing = "<tag:'ONEBLOCK'> <value><phase><body> <muted>(<phase_number>/<phase_count>)<body>: <value><phase_blocks><body> из <value><phase_length><body> блоков, всего сломано <value><blocks_broken><body>."
    # Строка момента OneBlock над блоком, как её называет файл фазы через text = "@key".
    moments {
        plains_chest = "<value>Сундук!<body> Открой его раньше всех."
    }
    # Что просят строки requires фазы; говорится ломающему, пока остров ждёт в конце предыдущей фазы.
    requires {
        missing = "<etag:'ONEBLOCK'> <body><value><phase><body> ждёт:"
        money = " <dim>•</dim> <money><amount></money> <muted>твоих денег"
        money_island = " <dim>•</dim> <money><amount></money> <muted>в банке острова"
        currency = " <dim>•</dim> <value><amount> <currency> <muted>твоих собственных"
        currency_island = " <dim>•</dim> <value><amount> <currency> <muted>в банке острова"
        items = " <dim>•</dim> <value><amount> <item>"
        level = " <dim>•</dim> <muted>уровень острова <level><needed>"
        permission = " <dim>•</dim> <muted>право <value><permission>"
        met = "<tag:'ONEBLOCK'> <body>Всё, что просит <value><phase><body>, есть, и фаза начинается."
    }
    # Говорится oneblock-lucky-break из modules/effects.conf при удачном ударе.
    lucky = "<tag:'ONEBLOCK'> <value>Удачный удар!<body> С ним пришло что-то хорошее."
    # Прогресс ломающего на полосе босса или над панелью действий, и где он показывается. Может называть <phase>,
    # <broken> и <length>.
    bar {
        line = "<value><phase> <muted><broken>/<length>"
        # Строка над блоком на языке сервера, пока включён progress.line.
        over_block = "<value><phase>\n<muted><broken>/<length>"
        switched = "<tag:'ONEBLOCK'> <body>Твой прогресс OneBlock теперь показывается <value><bar><body>."
        names {
            bossbar = "на полосе босса"
            actionbar = "над панелью действий"
            none = "нигде"
        }
    }
    # Говорится ломающему, когда впереди выпало враждебное существо. Может называть <creature> и <breaks>.
    creature_coming = "<etag:'ONEBLOCK'> <warn><creature><body> появится через <value><breaks><body> ударов."
    # Пути дальше из фазы, которая ветвится, говорятся, когда её файла нет, и выбор.
    branch {
        offer = "<tag:'ONEBLOCK'> <value><phase><body> заканчивается здесь. Без выбора через <value><time><body> будет взят путь <value><first><body>. Пути дальше:"
        way = " <dim>•</dim> <value><way>"
        picked = "<tag:'ONEBLOCK'> <body>Твой остров идёт от <value><phase><body> к <value><way><body>."
        taken = "<tag:'ONEBLOCK'> <body>Путь не выбран, поэтому твой остров идёт от <value><phase><body> к <value><way><body>."
    }
    # Обратный отсчёт над блоком фазы, которая ждёт после начала. Может называть <phase> и <time>.
    pause_line = "<value><phase>\n<body>начнётся через <value><time>"
    # Строка, которую списки began, finished или first-finished файла фазы называют через "@key".
    lists {
        plains_first = "<tag:'ONEBLOCK'> <body>Твой остров впервые оставил <value>Равнины<body> позади."
    }
    phases {
        plains = "Равнины"
        underground = "Подземелье"
        snow = "Снежные поля"
        ocean = "Морское дно"
        jungle = "Джунгли"
        nether = "Незер"
        end = "Край"
    }
    # Что содержит каждая поставляемая фаза, как её называет preview файла; показывается в меню фаз.
    previews {
        plains = "Трава, земля и дерево для стройки, домашние животные и сундук с сокровищами на 100-м ударе."
        underground = "Камень и первые руды: уголь, железо, медь и золото, с бочками сокровищ."
        snow = "Снег, лёд и ель, с лазуритом в холоде."
        ocean = "Песок, глина и призмарин, морские фонари и губки, и иногда сундук с обломков."
        jungle = "Тропическое дерево, мох, арбузы и бамбук, со спрятанными изумрудами."
        nether = "Незерак, кварц и золото, светокамень, а время от времени древние обломки."
        end = "Камень Края, обсидиан и пурпур, с алмазами в самом конце."
    }
