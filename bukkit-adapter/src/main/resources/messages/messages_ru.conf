# ==============================================================================
# Слова меню.
#
# Каждый файл меню в menus/ называет свои заголовки, названия предметов и описания через
# эти ключи, так что сервер со вторым языком получает меню на нём.
# Строка здесь может нести живое значение, с которым открыто меню: она пишется
# <argument_<name>>, теми же именами, что файл меню пишет как %argument_<name>%.
# ==============================================================================
menu {
    # Два слова, которые каждая плитка пишет над описанием и сведениями, одинаковые в каждом окне.
    lore {
        description = "Описание"
        details = "Подробности"
    }

    oneblock {
        title = "OneBlock"
        note = "<tag:'ONEBLOCK'> <body>Ломай блок, чтобы проходить фазы."
        phase {
            title = "<argument_phase>"
            crumb = "OneBlock"
            description = "Фаза, в которой сейчас блок. Каждая приносит свои блоки и мобов."
            number { label = "Фаза", value = "<value><argument_phase_number>/<argument_phase_count>" }
            action = "<cta>Нажми<subtext>, чтобы увидеть все фазы"
        }
        progress {
            title = "Эта фаза"
            crumb = "OneBlock"
            description = "Насколько твой остров прошёл фазу."
            percent { label = "Пройдено", value = "<level><argument_phase_percent>%" }
            broken { label = "Сломано", value = "<value><argument_phase_blocks>/<argument_phase_length>" }
            left { label = "Осталось", value = "<value><argument_phase_left>" }
            next { label = "Дальше", value = "<value><argument_next_phase>" }
        }
        bar {
            title = "Твой прогресс"
            crumb = "OneBlock"
            description = "Где показывается прогресс острова, пока ты ломаешь его блок."
            where { label = "Показ", value = "<value><argument_bar>" }
            action = "<cta>Нажми<subtext>, чтобы показывать в другом месте"
        }
        broken {
            title = "Все поломки"
            crumb = "OneBlock"
            description = "Каждый блок, который твой остров сломал с самого начала, и кто его сломал."
            total { label = "Сломано", value = "<value><argument_blocks_broken>" }
            mine { label = "Тобой", value = "<value><argument_my_breaks>" }
            top { label = "Больше всех", value = "<value><argument_top_member> <muted><argument_top_member_breaks>" }
        }
    }
    oneblock_phases {
        title = "Все фазы"
        summary {
            title = "<argument_phase>"
            crumb = "OneBlock"
            description = "Фаза, в которой сейчас твой остров. Пройденные фазы горят, следующие закрыты."
        }
        phase {
            title = "<entry_phase>"
            crumb = "Фаза"
            description = "<entry_reward>"
            number { label = "Фаза", value = "<value><entry_number>" }
            length { label = "Длится", value = "<value><entry_blocks><muted> поломок" }
            state { label = "Твой остров", value = "<value><entry_state>" }
            wait { label = "Ждёт", value = "<value><entry_wait>" }
            requires { label = "Требует", value = "<muted><entry_requires>" }
        }
        states {
            reached = "пройдена"
            current = "сейчас здесь"
            locked = "закрыта"
        }
    }
    oneblock_branch {
        title = "Выбери путь дальше"
        summary {
            title = "<argument_phase> заканчивается"
            crumb = "OneBlock"
            description = "Твой остров переходит в одну из этих фаз. Без выбора берётся первая."
            left { label = "Время на выбор", value = "<warn><argument_time>" }
        }
        way {
            title = "<entry_phase>"
            crumb = "Путь"
            description = "Фаза, в которую может перейти твой остров. Выбранный путь остаётся навсегда."
            length { label = "Длится", value = "<value><entry_blocks><muted> поломок" }
            action = "<cta>Нажми<subtext>, чтобы пойти этим путём"
        }
