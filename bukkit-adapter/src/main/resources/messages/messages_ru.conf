# Сообщения на русском.
#
# Каждая строка написана в MiniMessage, и каждая строка называет роль вместо цвета: <body> это
# текст, <value> имя или число, <money> сумма денег, <good> и <bad> состояние, а <tag:'ОСТРОВ'>
# метка в начале строки чата. Цвета за этими именами лежат в theme.conf, поэтому в этом файле
# их никогда нет.
#
# Пиши здесь обычные слова. Капитель есть только у латинских букв, поэтому русский текст
# выводится как написан; в small-caps файла theme.conf русского нет. <plain> оставляет команду
# или id в обычных буквах.
#
# Ключ, который ты удалишь, берёт строку, встроенную в плагин, так что игрок никогда не прочитает
# пустую строку. Скопируй этот файл в messages_<tag>.conf и переведи, чтобы добавить язык.

