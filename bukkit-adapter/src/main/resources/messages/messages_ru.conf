        voting = "<tag:'BRIX'> <body>Конкурс на тему <accent><theme><body> принимает голоса ещё <value><days>д <hours>ч <minutes>м<body>. Участков: <value><entered><body>. Встань на чужой участок и поставь ему от 1 до <value><most><body> звёзд через <value><cmd:'contest vote'><body>."
        none = "<tag:'BRIX'> <body>Строительный конкурс сейчас не идёт."
        # <owner> это владелец участка, занявшего первое место.
        last = "<tag:'BRIX'> <body>Строительный конкурс сейчас не идёт. Последний, на тему <accent><theme><body>, выиграл участок <value><owner><body>."
        # Говорится всем, когда оператор открывает конкурс.
        opened = "<tag:'BRIX'> <good>Начался строительный конкурс! <body>Тема: <accent><theme><body>. Запиши свой участок через <value><cmd:'contest join'><body> в течение <value><days>д <hours>ч <minutes>м<body>."
        # Говорится всем, когда стройка заканчивается и начинается голосование.
        votes_open = "<tag:'BRIX'> <body>Стройка на тему <accent><theme><body> закончена. Посети участвующие участки (их <value><entered><body>) и поставь каждому от 1 до <value><most><body> звёзд через <value><cmd:'contest vote'><body>, в течение <value><days>д <hours>ч <minutes>м<body>."
        # Говорится всем, когда голосование заканчивается; затем идёт по строке на каждое награждаемое место.
        ended = "<tag:'BRIX'> <body>Строительный конкурс на тему <accent><theme><body> закончен. Места:"
        # <average> это средние звёзды, а <votes> сколько проголосовало.
        place = "<body>  <accent>#<place></accent> участок <value><owner></value>: <value><average></value> звёзд, голосов: <value><votes></value>"
        ended_empty = "<tag:'BRIX'> <body>Строительный конкурс на тему <accent><theme><body> закончен, и ни один участок не участвовал."
        # <min> это наименьшее число голосов, нужное участку, чтобы занять место.
        ended_unplaced = "<tag:'BRIX'> <body>Строительный конкурс на тему <accent><theme><body> закончен. Ни один участок не набрал <value><min><body> голосов, нужных для места."
        # Говорится всем, когда оператор отменяет конкурс.
        closed = "<tag:'BRIX'> <body>Строительный конкурс на тему <accent><theme><body> отменён."
        joined = "<tag:'BRIX'> <good>Твой участок записан на конкурс на тему <theme>. Строй по теме, пока стройка не закончилась."
        already = "<tag:'BRIX'> <bad>Этот участок уже записан."
        not_building = "<tag:'BRIX'> <bad>Участки записываются только во время стройки конкурса."
        not_voting = "<tag:'BRIX'> <bad>Голоса принимаются только после окончания стройки и до конца голосования."
        not_entered = "<tag:'BRIX'> <bad>Этот участок не записан на конкурс."
        own_plot = "<tag:'BRIX'> <bad>Нельзя голосовать за участок своей команды."
        bad_stars = "<tag:'BRIX'> <bad>Поставь от 1 до <most> звёзд."
        voted = "<tag:'BRIX'> <good>Ты поставил этому участку <stars> звёзд. <body>Ты можешь изменить оценку до конца голосования."
        failed = "<tag:'BRIX'> <bad>Не удалось связаться с конкурсом. Попробуй снова."
        # Темы из modules/brix.conf по названию. Тема, которой здесь нет, показывается как написано.
        themes {
            lighthouse = "Маяк"
            castle = "Замок"
            treehouse = "Дом на дереве"
            village = "Деревня"
            ship = "Корабль"
            garden = "Сад"
        }
    }
}

